<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Jardim Eterno 💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght=0,700;1,700&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #d4af37; --purple: #7b2cbf; --dark: #0a001a; --pink: #ff4d6d; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; overflow-x: hidden; height: 100vh; width: 100vw;
            background: var(--dark); color: white; transition: 1s;
        }

        .coracao-bg { position: absolute; animation: flutuar 5s infinite ease-in-out; z-index: 0; pointer-events: none; }
        @keyframes flutuar { 
            0%, 100% { transform: scale(1) translateY(0) rotate(0deg); opacity: 0.2; } 
            50% { transform: scale(1.8) translateY(-20px) rotate(15deg); opacity: 0.5; } 
        }

        .pensamento-amor {
            position: fixed; top: 12%; width: 100%; text-align: center;
            font-family: 'Great Vibes', cursive; font-size: 1.8rem; color: var(--gold); z-index: 5;
            animation: brilhoMensagem 6s infinite ease-in-out;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        @keyframes brilhoMensagem { 0%, 100% { opacity: 0; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

        .astro { position: absolute; top: 20px; right: 20px; font-size: 3rem; z-index: 1; filter: drop-shadow(0 0 10px var(--gold)); }

        .secao { display: none; height: 100vh; width: 100%; padding: 20px 20px 120px; overflow-y: auto; position: relative; z-index: 2; }
        .secao.ativa { display: flex; flex-direction: column; align-items: center; }

        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 450px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); border-radius: 30px; display: flex; padding: 10px; border: 1px solid var(--purple); z-index: 1000;
        }
        .nav-item { color: #fff; opacity: 0.4; font-size: 0.65rem; cursor: pointer; text-align: center; flex: 1; }
        .nav-item.ativo { opacity: 1; color: var(--gold); font-weight: bold; }
        .nav-item span { display: block; font-size: 1.2rem; margin-bottom: 2px; }

        .glass-card {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px; padding: 20px; width: 100%; max-width: 400px; margin-bottom: 15px; text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .titulo-lux { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: var(--gold); margin: 15px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        .grid-raspa { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .raspa-item { position: relative; aspect-ratio: 1; border-radius: 20px; overflow: hidden; background: #fff; border: 2.5px solid var(--purple); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .texto-escondido { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: #1a0033; font-weight: bold; text-align: center; z-index: 1; font-family: 'Montserrat', sans-serif; padding: 5px; }
        canvas { position: absolute; inset: 0; z-index: 2; touch-action: none; }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
        .dia-cal { font-size: 0.7rem; padding: 10px 0; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.05); }
        .marcado { background: var(--purple) !important; color: white; border-color: var(--gold); box-shadow: 0 0 10px var(--purple); }

        .btn-lux { 
            background: linear-gradient(45deg, var(--purple), #9d4edd); 
            color: white; border: none; padding: 16px; border-radius: 50px; 
            font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px;
            font-family: 'Montserrat', sans-serif; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
        }
        .btn-lux:disabled { background: #555; cursor: not-allowed; box-shadow: none; }

        input, textarea { 
            width: 100%; background: rgba(255,255,255,0.1); border: 1.5px solid var(--purple); 
            border-radius: 15px; padding: 14px; color: white; margin-bottom: 12px;
            font-family: 'Montserrat', sans-serif;
        }

        .overlay { position: fixed; inset: 0; background: radial-gradient(circle, #1a0033, #050010); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .hidden { display: none !important; }

        /* Estilos do Mural de Fotos com Menu de Opções */
        .mural-fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 400px; }
        .foto-card { position: relative; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .foto-card img { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--purple); }
        .foto-card span { font-size: 0.65rem; display: block; margin-top: 7px; color: #ccc; }

        /* Botão de 3 pontinhos */
        .foto-menu-btn {
            position: absolute; top: 12px; right: 12px; width: 26px; height: 26px;
            background: rgba(0, 0, 0, 0.65); border-radius: 50px; color: white;
            font-size: 1rem; line-height: 24px; text-align: center; cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2); z-index: 10;
        }
        .foto-menu-options {
            display: none; position: absolute; top: 42px; right: 12px;
            background: #1a0033; border: 1px solid var(--purple); border-radius: 10px;
            overflow: hidden; z-index: 20; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .foto-menu-options.show { display: block; }
        .foto-menu-item {
            padding: 10px 14px; font-size: 0.75rem; color: #ff4d6d; font-weight: bold;
            cursor: pointer; background: transparent; border: none; width: 100%; text-align: left;
        }
        .foto-menu-item:active { background: rgba(255, 77, 109, 0.15); }
    </style>
</head>
<body>

    <div id="login" class="overlay">
        <h1 class="titulo-lux" style="font-size: 3.5rem;">Nosso Jardim</h1>
        <p style="font-family: 'Great Vibes', cursive; color: var(--gold); font-size: 1.5rem; margin-bottom: 20px;">Onde o amor floresce...</p>
        <input type="text" id="user-name" placeholder="Seu Nome">
        <input type="password" id="pw" placeholder="Senha Especial">
        <button class="btn-lux" onclick="entrar()">Entrar no Coração</button>
    </div>

    <div id="astro-icon" class="astro">☀️</div>
    <div id="bg-coracoes"></div>
    <div class="pensamento-amor" id="msgAmor">Seu amor está pensando em você...</div>

    <nav class="nav-bar hidden" id="menu">
        <div class="nav-item ativo" onclick="irPara('home', this)"><span>🏠</span>Início</div>
        <div class="nav-item" onclick="irPara('mimos', this)"><span>🎟️</span>Mimos</div>
        <div class="nav-item" onclick="irPara('fotos', this)"><span>📸</span>Fotos</div>
        <div class="nav-item" onclick="irPara('sonhos', this)"><span>✨</span>Sonhos</div>
        <div class="nav-item" onclick="irPara('correio', this)"><span>💌</span>Correio</div>
    </nav>

    <main id="app" class="hidden">
        <section id="home" class="secao ativa">
            <h1 class="titulo-lux" id="msgBoasVindas">Para Meu Amor</h1>
            <img src="Amor.png" style="width:100%; max-width:350px; border-radius:25px; border: 3px solid var(--gold); margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div id="timer" style="font-family: 'Great Vibes', cursive; font-size: 2rem; color: var(--gold); margin-bottom: 15px;"></div>

            <div class="glass-card">
                <p id="label-raspa" style="font-size:0.7rem; font-weight:bold; letter-spacing:2px; color: var(--gold);">SURPRESA DE HOJE</p>
                <div class="grid-raspa" id="raspaGrid"></div>
            </div>

            <div class="glass-card">
                <p style="font-size:0.7rem; font-weight:bold; letter-spacing:1px;">NOSSO CALENDÁRIO</p>
                <div class="cal-grid" id="calGrid"></div>
            </div>
        </section>

        <section id="mimos" class="secao">
            <h2 class="titulo-lux">Cupons de Carinho</h2>
            <div id="cuponsGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width:100%; max-width:400px;"></div>
        </section>

        <section id="fotos" class="secao">
            <h2 class="titulo-lux">Nossos Momentos</h2>
            <div class="glass-card">
                <p style="font-size:0.8rem; margin-bottom:10px; color:var(--gold);">Guarde uma foto da sua galeria aqui 💜</p>
                <input type="file" id="inputFoto" accept="image/*" style="display:none;">
                <button class="btn-lux" onclick="document.getElementById('inputFoto').click()">Selecionar da Galeria</button>
                <button class="btn-lux" id="btnUpload" onclick="enviarFotoDirect()" style="background:linear-gradient(45deg, #2a9d8f, #e9c46a); display:none; margin-top:8px;">Enviar Foto ✨</button>
                <div id="statusUpload" style="font-size:0.8rem; margin-top:8px; color:var(--gold);"></div>
            </div>
            <div class="mural-fotos" id="muralFotos"></div>
        </section>

        <section id="sonhos" class="secao">
            <h2 class="titulo-lux">Nossos Sonhos</h2>
            <div id="listaSonhos" style="width:100%; max-width:400px; margin-bottom: 15px;"></div>
            <div class="glass-card">
                <input type="text" id="inputSonho" placeholder="O que vamos realizar?">
                <button class="btn-lux" onclick="addSonho()">Adicionar Sonho</button>
            </div>
        </section>

        <section id="correio" class="secao">
            <h2 class="titulo-lux">Cartinhas de Amor</h2>
            <div class="glass-card">
                <textarea id="textoC" rows="4" placeholder="Escreva algo lindo..."></textarea>
                <button class="btn-lux" onclick="enviarC()">Enviar com Amor 💌</button>
            </div>
            <div id="muralC" style="width:100%; max-width:400px;"></div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz3H8bjiuS2gNvxUr_G3Csd21wL5J1gLw",
            authDomain: "project-3726343372287499417.firebaseapp.com",
            databaseURL: "https://project-3726343372287499417-default-rtdb.firebaseio.com",
            projectId: "project-3726343372287499417"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let usuarioAtivo = "";

        window.irPara = (id, el) => {
            document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('ativo'));
            document.getElementById(id).classList.add('ativa');
            el.classList.add('ativo');
        };

        window.entrar = () => {
            const nomeInput = document.getElementById('user-name').value.trim();
            if(document.getElementById('pw').value === "2810" && nomeInput !== "") {
                usuarioAtivo = nomeInput;
                document.getElementById('msgBoasVindas').innerText = "Oi, " + usuarioAtivo + "!";
                document.getElementById('login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('menu').classList.remove('hidden');
                initVisual();
                sync();
            }
        };

        function initVisual() {
            const h = new Date().getHours();
            const isDia = h >= 6 && h < 18;
            document.body.style.background = isDia ? "radial-gradient(circle, #7b2cbf, #1a0033)" : "linear-gradient(to bottom, #050010, #1a0033)";
            document.getElementById('astro-icon').innerText = isDia ? "☀️" : "🌙";

            const bg = document.getElementById('bg-coracoes');
            bg.innerHTML = "";
            const emojis = ['❤️', '💖', '💘', '💜'];
            for(let i=0; i<25; i++) {
                const c = document.createElement('div'); 
                c.className = 'coracao-bg'; 
                c.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                c.style.left = Math.random() * 100 + 'vw'; 
                c.style.top = Math.random() * 100 + 'vh';
                c.style.fontSize = (Math.random() * 20 + 20) + 'px';
                c.style.animationDelay = Math.random() * 5 + 's'; 
                bg.appendChild(c);
            }

            const diff = Math.floor((new Date() - new Date("2025-10-28")) / (1000 * 60 * 60 * 24));
            document.getElementById('timer').innerText = diff + " Dias Juntos";

            const cal = document.getElementById('calGrid');
            cal.innerHTML = "";
            for(let i=1; i<=31; i++) {
                const d = document.createElement('div'); d.className="dia-cal"; d.innerText=i;
                d.onclick=()=>d.classList.toggle('marcado'); cal.appendChild(d);
            }
        }

        document.getElementById('inputFoto').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('btnUpload').style.display = 'block';
                document.getElementById('statusUpload').innerText = "Foto pronta para enviar! ✨";
            }
        });

        window.enviarFotoDirect = () => {
            const fileInput = document.getElementById('inputFoto');
            const file = fileInput.files[0];
            const btn = document.getElementById('btnUpload');
            const status = document.getElementById('statusUpload');

            if (!file) return;

            btn.disabled = true;
            status.innerText = "Guardando no jardim... ⏳";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 450;
                    
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrlComprimida = canvas.toDataURL('image/jpeg', 0.65);

                    push(ref(db, 'mural_fotos_direto'), {
                        imagem: dataUrlComprimida,
                        autor: usuarioAtivo,
                        data: new Date().toLocaleDateString()
                    }).then(() => {
                        status.innerText = "Foto guardada com sucesso! 🥰";
                        fileInput.value = "";
                        btn.style.display = 'none';
                        btn.disabled = false;
                    }).catch((err) => {
                        console.error(err);
                        status.innerText = "Erro ao enviar. Tente novamente!";
                        btn.disabled = false;
                    });
                };
            };
        };

        // Funções globais para gerenciar o menu flutuante de deletar
        window.toggleMenuFoto = (id) => {
            const menu = document.getElementById('menu-' + id);
            const estaAberto = menu.classList.contains('show');
            document.querySelectorAll('.foto-menu-options').forEach(m => m.classList.remove('show'));
            if (!estaAberto) menu.classList.add('show');
        };

        window.deletarFoto = (id) => {
            if (confirm("Quer mesmo tirar essa foto do mural? 💔")) {
                remove(ref(db, 'mural_fotos_direto/' + id))
                    .then(() => alert("Foto removida!"))
                    .catch(() => alert("Erro ao remover a foto."));
            }
        };

        // Fecha menus abertos se clicar fora deles
        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('foto-menu-btn')) {
                document.querySelectorAll('.foto-menu-options').forEach(m => m.classList.remove('show'));
            }
        });

        function sync() {
            const hojeStr = new Date().toLocaleDateString();
            const itensEduarda = ["Beijo Apaixonado", "Açaí Geladinho", "Massagem Relax", "Jantar Especial"];
            const itensNamorado = ["Vale Cinema", "Dormir Juntinho", "Cafuné Infinito", "Doce Favorito"];
            const meusItens = (usuarioAtivo.toLowerCase().includes("eduarda") || usuarioAtivo.toLowerCase().includes("duda")) ? itensEduarda : itensNamorado;
            const raspaRef = ref(db, 'raspa_individual/' + usuarioAtivo.replace(/\s/g, '_'));

            onValue(raspaRef, s => {
                const d = s.val() || { raspadas: [false, false, false, false], dataUltima: "" };
                const grid = document.getElementById('raspaGrid');
                grid.innerHTML = "";
                const jaRaspoHoje = d.dataUltima === hojeStr;

                if(jaRaspoHoje) document.getElementById('label-raspa').innerText = "VEM AMANHÃ PROCURAR MAIS! ✨";

                meusItens.forEach((txt, i) => {
                    const item = document.createElement('div'); item.className = "raspa-item";
                    item.innerHTML = `<div class="texto-escondido">${txt}</div><canvas id="cv${i}"></canvas>`;
                    grid.appendChild(item);

                    const cv = document.getElementById(`cv${i}`); const ctx = cv.getContext('2d'); cv.width=150; cv.height=150;

                    if(d.raspadas[i]) { 
                        ctx.clearRect(0,0,150,150); 
                    } else {
                        ctx.fillStyle = '#9d4edd'; ctx.fillRect(0,0,150,150);
                        ctx.globalCompositeOperation = 'destination-out';

                        const draw = (e) => {
                            if(jaRaspoHoje) return;
                            e.preventDefault(); const r = cv.getBoundingClientRect();
                            const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                            const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                            ctx.beginPath(); ctx.arc(x,y,25,0,Math.PI*2); ctx.fill();

                            const pix = ctx.getImageData(0,0,150,150).data;
                            let vago = 0; for(let p=3; p<pix.length; p+=4) if(pix[p]===0) vago++;

                            if(vago > 5000) { 
                                let novasRaspadas = d.raspadas;
                                novasRaspadas[i] = true;
                                update(raspaRef, { dataUltima: hojeStr, raspadas: novasRaspadas }); 
                            }
                        };
                        cv.addEventListener('touchmove', draw); cv.addEventListener('mousemove', draw);
                    }
                });
            });

            // Monitoramento e montagem estruturada do mural com os 3 pontinhos inclusos
            onValue(ref(db, 'mural_fotos_direto'), s => {
                const mural = document.getElementById('muralFotos');
                mural.innerHTML = "";
                s.forEach(snapshot => {
                    const idFoto = snapshot.key;
                    const f = snapshot.val();
                    
                    const cardHtml = `
                        <div class="foto-card">
                            <div class="foto-menu-btn" onclick="toggleMenuFoto('${idFoto}')">⋮</div>
                            <div class="foto-menu-options" id="menu-${idFoto}">
                                <button class="foto-menu-item" onclick="deletarFoto('${idFoto}')">Excluir</button>
                            </div>
                            <img src="${f.imagem}" alt="Momento">
                            <span>Por: ${f.autor} (${f.data})</span>
                        </div>
                    `;
                    mural.innerHTML = cardHtml + mural.innerHTML;
                });
            });

            onValue(ref(db, 'cupons_vFinal'), s => {
                const d = s.val() || { d: ["Massagem", "Vale Jantar", "Beijo de 1 min", "Açaí Médio"], u: [false,false,false,false], autores: ["","","",""] };
                const grid = document.getElementById('cuponsGrid'); grid.innerHTML = "";
                d.d.forEach((c, i) => {
                    const isU = d.u[i];
                    grid.innerHTML += `<div class="glass-card" style="padding:15px; cursor:pointer; ${isU?'opacity:0.4;':''}" onclick="usarC(${i})">
                        <span style="font-family:'Playfair Display'; ${isU?'text-decoration:line-through; color:red;':''}">🎟️ ${c}</span>
                        <div style="font-size:0.5rem; margin-top:5px;">${isU?'Usado por: '+d.autores[i]:'Disponível'}</div>
                    </div>`;
                });
                window.usarC = (i) => { if(!d.u[i]) { d.u[i]=true; d.autores[i]=usuarioAtivo; update(ref(db, 'cupons_vFinal'), d); } };
            });

            onValue(ref(db, 'sonhos_v2'), s => {
                const l = document.getElementById('listaSonhos'); l.innerHTML = "";
                s.forEach(item => {
                    const v = item.val();
                    l.innerHTML += `<div style="display:flex; align-items:center; background:rgba(255,255,255,0.1); padding:10px 15px; border-radius:15px; margin-bottom:8px;">
                        <input type="checkbox" style="margin-right:12px; width:22px; height:22px;" ${v.status?'checked':''} onchange="update(ref(getDatabase(), 'sonhos_v2/${item.key}'), {status:!${v.status}})">
                        <span style="font-size:0.95rem; flex:1; text-align:left; font-family:'Playfair Display'; ${v.status?'text-decoration:line-through; opacity:0.5;':''}">${v.texto}</span>
                    </div>`;
                });
            });

            onValue(ref(db, 'correio_v2'), s => {
                const m = document.getElementById('muralC'); m.innerHTML = "";
                s.forEach(c => { m.innerHTML = `<div class="glass-card" style="text-align:left; font-family:'Playfair Display'; font-size:0.9rem; font-style:italic;">${c.val().texto}</div>` + m.innerHTML; });
            });
        }

        window.addSonho = () => {
            const v = document.getElementById('inputSonho').value;
            if(v) push(ref(db, 'sonhos_v2'), { texto: v, status: false });
            document.getElementById('inputSonho').value = "";
        };

        window.enviarC = () => {
            const v = document.getElementById('textoC').value;
            if(v) push(ref(db, 'correio_v2'), { texto: `${v}\n\n— Com carinho: ${usuarioAtivo} 🌹` });
            document.getElementById('textoC').value = "";
        };
    </script>
</body>
</html>
