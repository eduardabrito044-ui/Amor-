<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Jardim Eterno 💜</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7b2cbf">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #d4af37; --purple: #7b2cbf; --dark: #0a001a; --pink: #ff4d6d; --green: #2a9d8f; --red: #e63946; --orange: #f4a261; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; overflow-x: hidden; height: 100vh; width: 100vw; background: var(--dark); color: white; transition: 1s; }
        .coracao-bg { position: absolute; animation: flutuar 5s infinite ease-in-out; z-index: 0; pointer-events: none; }
        @keyframes flutuar { 0%, 100% { transform: scale(1) translateY(0) rotate(0deg); opacity: 0.2; } 50% { transform: scale(1.8) translateY(-20px) rotate(15deg); opacity: 0.5; } }
        .pensamento-amor { position: fixed; top: 12%; width: 100%; text-align: center; font-family: 'Great Vibes', cursive; font-size: 1.8rem; color: var(--gold); z-index: 5; animation: brilhoMensagem 6s infinite ease-in-out; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        @keyframes brilhoMensagem { 0%, 100% { opacity: 0; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }
        .astro { position: absolute; top: 20px; right: 20px; font-size: 3rem; z-index: 1; filter: drop-shadow(0 0 10px var(--gold)); }
        .secao { display: none; height: 100vh; width: 100%; padding: 20px 20px 120px; overflow-y: auto; position: relative; z-index: 2; }
        .secao.ativa { display: flex; flex-direction: column; align-items: center; }
        .nav-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 500px; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); border-radius: 30px; display: flex; padding: 10px; border: 1px solid var(--purple); z-index: 1000; }
        .nav-item { color: #fff; opacity: 0.4; font-size: 0.6rem; cursor: pointer; text-align: center; flex: 1; }
        .nav-item.ativo { opacity: 1; color: var(--gold); font-weight: bold; }
        .nav-item span { display: block; font-size: 1.1rem; margin-bottom: 2px; }
        .glass-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15); border-radius: 25px; padding: 20px; width: 100%; max-width: 400px; margin-bottom: 15px; text-align: center; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .titulo-lux { font-family: 'Great Vibes', cursive !important; font-size: 3.2rem; color: var(--gold); margin: 15px 0; text-shadow: 2px 2px 6px rgba(0,0,0,0.4); text-align: center; }
        .btn-lux { background: linear-gradient(45deg, var(--purple), #9d4edd); color: white; border: none; padding: 16px; border-radius: 50px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; font-family: 'Montserrat', sans-serif; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4); }
        .btn-lux:disabled { background: #555 !important; cursor: not-allowed; }
        input, textarea, select { width: 100%; background: rgba(255,255,255,0.1); border: 1.5px solid var(--purple); border-radius: 15px; padding: 14px; color: white; margin-bottom: 12px; }
        .overlay { position: fixed; inset: 0; background: radial-gradient(circle, #1a0033, #050010); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .hidden { display: none !important; }
        .sub-jogo-container { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; }
        .sub-jogo-container.ativo { display: flex; }
        .game-menu-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--purple); padding: 15px; border-radius: 15px; width: 100%; margin-bottom: 10px; text-align: left; display: flex; align-items: center; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        
        /* Puzzle specific styles */
        .puzzle-grid-real { display: grid; gap: 4px; width: 100%; max-width: 320px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 15px; border: 2px solid var(--purple); margin: 15px 0; }
        .puzzle-slot-real { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; position: relative; font-size: 0.7rem; color: rgba(255,255,255,0.3); }
        .puzzle-pecas-pool { display: flex; gap: 10px; overflow-x: auto; width: 100%; padding: 10px 5px; margin-bottom: 10px; background: rgba(255,255,255,0.03); border-radius: 12px; }
        .puzzle-peca-item { width: 65px; height: 65px; flex-shrink: 0; border-radius: 6px; border: 2px solid var(--gold); overflow: hidden; cursor: pointer; position: relative; }
        .puzzle-peca-item.selecionada { outline: 3px solid var(--pink); transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="login" class="overlay">
        <h1 class="titulo-lux">Nosso Jardim</h1>
        <input type="text" id="user-name" placeholder="Seu Nome">
        <input type="password" id="pw" placeholder="Senha Especial">
        <button class="btn-lux" onclick="entrar()">Entrar</button>
    </div>

    <nav class="nav-bar hidden" id="menu">
        <div class="nav-item ativo" onclick="irPara('home', this)"><span>🏠</span>Início</div>
        <div class="nav-item" onclick="irPara('jogos', this)"><span>🎮</span>Jogos</div>
    </nav>

    <main id="app" class="hidden">
        <section id="home" class="secao ativa">
            <h1 class="titulo-lux" id="msgBoasVIndas">Olá!</h1>
        </section>

        <section id="jogos" class="secao">
            <h2 class="titulo-lux">Arena de Jogos 🎮</h2>

            <div id="menu-jogos" style="width:100%; max-width:400px;">
                <div class="game-menu-btn" onclick="abrirJogo('puzzle')"><span>🧩</span>Quebra-Cabeça Fofo</div>
                </div>

            <div id="jogo-puzzle" class="sub-jogo-container">
                <div class="glass-card">
                    <button class="btn-lux" style="padding:8px; font-size:0.75rem; margin-bottom:10px;" onclick="voltarMenuJogos()">↩ Voltar à Arena</button>
                    <div id="puzzle-turno-txt" style="font-weight:bold; color:var(--gold); margin-bottom:12px;">Carregando...</div>
                    <select id="select-puzzle-tamanho" onchange="window.mudarDificuldadePuzzle(this.value)">
                        <option value="3">9 Peças (Fácil)</option>
                        <option value="4">16 Peças (Médio)</option>
                    </select>
                    <div class="puzzle-pecas-pool" id="pool-pecas"></div>
                    <div class="puzzle-grid-real" id="grid-puzzle-real"></div>
                    <div id="puzzle-status" style="margin-top:10px; font-size:0.85rem; font-weight:bold; color:var(--gold);"></div>
                    <button class="btn-lux" id="btn-concluir-puzzle" style="display:none;">Concluir 🧩</button>
                    <button class="btn-lux" id="btn-reset-puzzle" style="background:#ff4d6d;">Resetar 🔄</button>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        // CONFIGURAÇÃO (Insira sua config aqui)
        const db = getDatabase(initializeApp({ /* ... sua config ... */ }));
        
        let pecaSelecionadaLocal = null;
        let usuarioAtivo = "";

        window.abrirJogo = (id) => {
            document.getElementById('menu-jogos').style.display = 'none';
            document.getElementById('jogo-' + id).classList.add('ativo');
        };

        window.voltarMenuJogos = () => {
            document.querySelectorAll('.sub-jogo-container').forEach(c => c.classList.remove('ativo'));
            document.getElementById('menu-jogos').style.display = 'block';
        };

        // --- LÓGICA DO PUZZLE ---
        const puzzleRef = ref(db, 'arena_jogos/puzzle_real');
        
        window.mudarDificuldadePuzzle = (tamanho) => {
            const N = parseInt(tamanho);
            update(puzzleRef, { tamanhoGrade: N, gridPosicoes: Array(N * N).fill(""), turno: usuarioAtivo });
        };

        onValue(puzzleRef, snapshot => {
            let data = snapshot.val();
            if (!data) return;
            
            const N = data.tamanhoGrade || 3;
            const boardReal = document.getElementById('grid-puzzle-real');
            boardReal.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
            
            // ... (restante da lógica de renderização que você já tinha)
        });

        // Funções de navegação básicas
        window.irPara = (id, el) => {
            document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
            document.getElementById(id).classList.add('ativa');
        };
        
        window.entrar = () => {
            document.getElementById('login').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('menu').classList.remove('hidden');
        };
    </script>
</body>
</html>
