<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Infinito ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&family=Dancing+Script:wght@700&display=swap');

        :root {
            --primary: #ff85a2;
            --secondary: #d4af37;
            --bg: #fff0f3;
            --text: #4a4a4a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: 'Poppins', sans-serif; 
            background: var(--bg); color: var(--text); 
            overflow-x: hidden; transition: 1s; 
        }

        body.noite { --bg: #0a0a1a; --text: #f0f0f0; --primary: #8e44ad; }
        .stars, .nuvens { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* Telas de Bloqueio e Identificação */
        .overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .hidden { display: none !important; }

        nav { 
            position: fixed; top: 0; width: 100%; background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px); display: flex; overflow-x: auto; 
            padding: 10px; z-index: 1000; border-bottom: 2px solid var(--primary);
        }
        nav::-webkit-scrollbar { display: none; }
        nav a { padding: 8px 15px; text-decoration: none; color: var(--text); font-size: 0.8rem; font-weight: 600; white-space: nowrap; }

        .container { padding: 80px 15px 30px; }
        .card { 
            background: rgba(255,255,255,0.15); border: 2px solid var(--primary);
            border-radius: 25px; padding: 20px; margin-bottom: 20px;
            backdrop-filter: blur(5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .titulo { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: var(--primary); margin: 10px 0; text-align: center; }

        .heart-btn {
            width: 100px; height: 100px; background: #ff4757; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; margin: 15px auto; animation: pulse 1.5s infinite;
            border: none; cursor: pointer;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .grid-cartas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .envelope { 
            height: 80px; background: var(--primary); border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 1.2rem; color: white; cursor: pointer;
        }

        input, textarea, select { 
            width: 100%; padding: 12px; border-radius: 15px; border: 2px solid var(--primary);
            background: rgba(255,255,255,0.2); color: var(--text); margin-bottom: 10px; font-family: inherit;
        }
        .btn { 
            background: var(--primary); color: white; border: none; padding: 12px 20px; 
            border-radius: 50px; font-weight: bold; width: 100%; cursor: pointer;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideIn 0.4s ease; }
        @keyframes slideIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="bloqueio" class="overlay">
        <h1 class="titulo">Nosso Mundo</h1>
        <input type="password" id="inputSenha" placeholder="Senha (Nossa Data)">
        <button class="btn" onclick="acessar()">Entrar</button>
    </div>

    <div id="quem-e-voce" class="overlay hidden">
        <h2 class="titulo">Quem está entrando?</h2>
        <button class="btn" onclick="definirUsuario('Eduarda')" style="margin-bottom: 15px;">Sou a Eduarda 👑</button>
        <button class="btn" onclick="definirUsuario('Amor')" style="background: var(--secondary)">Sou o Amor 🧸</button>
    </div>

    <div id="conteudo-privado" class="hidden">
        <div id="ambiente"></div>
        <nav>
            <a href="#" onclick="tab(event, 'home')">🏠 Home</a>
            <a href="#" onclick="tab(event, 'correio')">💌 Cartas</a>
            <a href="#" onclick="tab(event, 'escrever')">✍️ Escrever</a>
            <a href="#" onclick="tab(event, 'metas')">🚀 Metas</a>
            <a href="#" onclick="tab(event, 'capsula')">⏳ Cápsula</a>
        </nav>

        <div class="container">
            <div id="home" class="tab-content active">
                <h1 class="titulo">Desde 28/12/2025</h1>
                <p id="timer" style="font-weight: bold; font-size: 1.2rem; text-align: center;"></p>
                <div class="card">
                    <p style="text-align: center;">Tô pensando em você!</p>
                    <button class="heart-btn" onclick="pensar()">❤️</button>
                    <p id="contagemPensar" style="text-align: center;">0 vezes hoje</p>
                </div>
            </div>

            <div id="correio" class="tab-content">
                <h2 class="titulo">Para Você</h2>
                <p style="text-align: center; font-size: 0.8rem;">Toque para ler o que te enviaram</p>
                <div class="grid-cartas">
                    <div class="envelope" onclick="lerCarta('Saudade')">📩<br><small>Saudade</small></div>
                    <div class="envelope" onclick="lerCarta('Triste')">📩<br><small>Triste</small></div>
                    <div class="envelope" onclick="lerCarta('Sorrir')">📩<br><small>Sorrir</small></div>
                    <div class="envelope" onclick="lerCarta('Elogio')">📩<br><small>Elogio</small></div>
                </div>
                <div id="cartaAberta" class="card" style="display:none; margin-top:20px; white-space: pre-wrap;"></div>
            </div>

            <div id="escrever" class="tab-content">
                <h2 class="titulo">Escrever Surpresa</h2>
                <div class="card">
                    <p>Para qual carta?</p>
                    <select id="selectTipo">
                        <option value="Saudade">Saudade</option>
                        <option value="Triste">Triste</option>
                        <option value="Sorrir">Fazer Sorrir</option>
                        <option value="Elogio">Elogio</option>
                    </select>
                    <textarea id="textoMensagem" placeholder="Escreva sua mensagem fofa aqui..." rows="4"></textarea>
                    <button class="btn" onclick="enviarMensagem()">Enviar para o Coração dele(a)</button>
                </div>
            </div>

            <div id="metas" class="tab-content">
                <h2 class="titulo">Nossas Metas</h2>
                <div class="card">
                    <div class="progress-container"><div class="progress-bar" id="progressoMetas"></div></div>
                    <div id="listaMetas"></div>
                    <input type="text" id="novaMeta" placeholder="Nova meta...">
                    <button class="btn" onclick="addMeta()">Adicionar</button>
                </div>
            </div>

            <div id="capsula" class="tab-content">
                <h2 class="titulo">Cápsula</h2>
                <div class="card">
                    <textarea id="textoCapsula" placeholder="Mensagem para o futuro..."></textarea>
                    <input type="date" id="dataCapsula">
                    <button class="btn" onclick="salvarCapsula()">Enterrar</button>
                    <div id="mensagensCapsula" style="margin-top:20px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, update, increment } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz3H8bjiuS2gNvxUr_G3Csd21wL5J1gLw",
            authDomain: "project-3726343372287499417.firebaseapp.com",
            databaseURL: "https://project-3726343372287499417-default-rtdb.firebaseio.com",
            projectId: "project-3726343372287499417",
            storageBucket: "project-3726343372287499417.firebasestorage.app",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let usuarioAtual = "";

        // --- ACESSO ---
        window.acessar = () => {
            if(document.getElementById('inputSenha').value === "2810") {
                document.getElementById('bloqueio').classList.add('hidden');
                document.getElementById('quem-e-voce').classList.remove('hidden');
            } else { alert("Senha errada!"); }
        };

        window.definirUsuario = (nome) => {
            usuarioAtual = nome;
            document.getElementById('quem-e-voce').classList.add('hidden');
            document.getElementById('conteudo-privado').classList.remove('hidden');
            configurarAmbiente();
            iniciarTimer();
        };

        // --- ESCRITA E LEITURA (O coração do pedido) ---
        window.enviarMensagem = () => {
            const tipo = document.getElementById('selectTipo').value;
            const texto = document.getElementById('textoMensagem').value;
            const destino = (usuarioAtual === "Eduarda") ? "Amor" : "Eduarda";
            
            if(!texto) return alert("Escreva algo!");
            
            // Salva na pasta do DESTINATÁRIO
            set(ref(db, `cartas/${destino}/${tipo}`), { msg: texto, de: usuarioAtual });
            alert("Sua surpresa foi enviada! ❤️");
            document.getElementById('textoMensagem').value = "";
        };

        window.lerCarta = (tipo) => {
            // Busca o que foi escrito para o USUÁRIO ATUAL
            onValue(ref(db, `cartas/${usuarioAtual}/${tipo}`), (s) => {
                const div = document.getElementById('cartaAberta');
                div.style.display = 'block';
                if(s.exists()) {
                    div.innerHTML = `<strong>De: ${s.val().de}</strong><br><br>${s.val().msg}`;
                } else {
                    div.innerHTML = "Ainda não há mensagem aqui. Peça para ele(a) escrever! ❤️";
                }
            }, { onlyOnce: true });
        };

        // --- SISTEMA DE TEMA ---
        function configurarAmbiente() {
            const hora = new Date().getHours();
            if(hora >= 18 || hora < 6) {
                document.body.classList.add('noite');
                document.getElementById('ambiente').innerHTML = '<div class="stars"></div>';
                gerarEstrelas();
            } else {
                document.getElementById('ambiente').innerHTML = '<div class="nuvens">☁️</div>';
            }
        }

        // --- RESTANTE DAS FUNÇÕES MANTIDAS ---
        window.pensar = () => {
            update(ref(db, 'interacoes'), { totalPensamentos: increment(1) });
            if(navigator.vibrate) navigator.vibrate(100);
        };
        onValue(ref(db, 'interacoes/totalPensamentos'), (s) => {
            document.getElementById('contagemPensar').innerText = (s.val() || 0) + " vezes hoje";
        });

        window.addMeta = () => {
            const t = document.getElementById('novaMeta').value;
            if(t) push(ref(db, 'metas'), { texto: t, feito: false });
            document.getElementById('novaMeta').value = "";
        };
        onValue(ref(db, 'metas'), (snap) => {
            const list = document.getElementById('listaMetas');
            list.innerHTML = "";
            let totais = 0, feitos = 0;
            snap.forEach(c => {
                totais++; if(c.val().feito) feitos++;
                list.innerHTML += `<div class="item-lista">
                    <input type="checkbox" ${c.val().feito ? 'checked' : ''} onchange="update(ref(getDatabase(), 'metas/${c.key}'), { feito: ${!c.val().feito} })">
                    <span>${c.val().texto}</span>
                </div>`;
            });
            document.getElementById('progressoMetas').style.width = (feitos/totais*100 || 0) + '%';
        });

        window.salvarCapsula = () => {
            const txt = document.getElementById('textoCapsula').value;
            const data = document.getElementById('dataCapsula').value;
            if(txt && data) push(ref(db, 'capsula'), { txt, data });
            document.getElementById('textoCapsula').value = "";
        };
        onValue(ref(db, 'capsula'), (snap) => {
            const div = document.getElementById('mensagensCapsula');
            div.innerHTML = "";
            const hoje = new Date().toISOString().split('T')[0];
            snap.forEach(c => {
                const liberado = hoje >= c.val().data;
                div.innerHTML += `<div class="card" style="opacity:${liberado ? 1 : 0.5}">${liberado ? c.val().txt : '🔒 Abre em: ' + c.val().data}</div>`;
            });
        });

        window.tab = (e, id) => {
            e.preventDefault();
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        function iniciarTimer() {
            const d = new Date(2025, 11, 28);
            setInterval(() => {
                const diff = Math.floor((new Date() - d) / 86400000);
                document.getElementById('timer').innerText = diff + " dias infinitos";
            }, 1000);
        }

        function gerarEstrelas() {
            const sF = document.querySelector('.stars');
            if(!sF) return;
            for(let i=0; i<40; i++){
                const s = document.createElement('div');
                s.style.position = 'absolute'; s.style.background = 'white';
                s.style.width = s.style.height = '2px';
                s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
                sF.appendChild(s);
            }
        }
    </script>
</body>
</html>
