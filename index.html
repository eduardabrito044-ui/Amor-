<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Você 💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #d4af37; 
            --purple-soft: #9d4edd;
            --transition: all 0.5s ease;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; 
            overflow: hidden; height: 100vh; width: 100vw;
            transition: var(--transition);
            background: #000;
        }

        /* Temas Poéticos */
        body.dia-claro { 
            background: radial-gradient(circle at top, #fff5f8, #e0c3fc); 
            color: #2d005d; --card-bg: rgba(255, 255, 255, 0.6);
        }
        body.noite-estrelada { 
            background: radial-gradient(circle at bottom, #10002b, #240046, #000);
            color: #e0aaff; --card-bg: rgba(60, 9, 108, 0.3);
        }

        .secao { 
            display: none; height: 100vh; width: 100%; 
            padding: 40px 20px 130px; overflow-y: auto; 
            animation: fadeIn 0.6s ease;
        }
        .secao.ativa { display: flex; flex-direction: column; align-items: center; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .nav-bar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 400px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(25px);
            border-radius: 35px; display: flex; justify-content: space-around;
            padding: 12px; border: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000;
        }
        .nav-item { color: #fff; opacity: 0.4; font-size: 0.65rem; cursor: pointer; text-align: center; flex: 1; transition: 0.3s; }
        .nav-item.ativo { opacity: 1; color: var(--gold); }
        .nav-item span { display: block; font-size: 1.3rem; margin-bottom: 2px; }

        .glass-card {
            background: var(--card-bg); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; padding: 25px; width: 100%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 20px; text-align: center;
        }

        .titulo-lux {
            font-family: 'Playfair Display', serif; font-size: 2.6rem; font-style: italic; margin: 5px 0;
            background: linear-gradient(45deg, var(--purple-soft), var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .foto-inteira-container { width: 100%; max-width: 350px; margin-bottom: 15px; }
        .foto-inteira-img { width: 100%; height: auto; max-height: 35vh; object-fit: contain; border-radius: 25px; border: 1px solid rgba(255,255,255,0.2); }

        .grid-raspa { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        .raspa-item { position: relative; aspect-ratio: 1; border-radius: 20px; overflow: hidden; background: #fff; border: 1px solid rgba(0,0,0,0.05); }
        .texto-escondido { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; color: #240046; text-align: center; padding: 5px; }
        canvas { position: absolute; inset: 0; z-index: 2; cursor: crosshair; }

        .btn-lux { background: var(--purple-soft); color: white; border: none; padding: 16px; border-radius: 50px; font-weight: 600; width: 100%; cursor: pointer; transition: 0.3s; }

        .overlay { position: fixed; inset: 0; background: radial-gradient(circle, #1a1a1a, #000); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .hidden { display: none !important; }

        .dia-cal { padding: 10px 5px; border: 1px solid rgba(157,78,221,0.15); border-radius: 10px; text-align: center; font-size: 0.75rem; }
        .marcado { background: var(--purple-soft) !important; color: #fff !important; }
        
        input, textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--purple-soft); border-radius: 15px; padding: 12px; color: inherit; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="login" class="overlay">
        <h1 class="titulo-lux" style="color: #fff; -webkit-text-fill-color: initial;">Para Você</h1>
        <input type="password" id="pw" placeholder="Sua senha secreta" style="max-width: 250px; text-align: center;">
        <button class="btn-lux" style="max-width: 200px;" onclick="entrar()">Entrar</button>
    </div>

    <nav class="nav-bar hidden" id="menu">
        <div class="nav-item ativo" onclick="irPara('home', this)"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="irPara('sonhos', this)"><span>✨</span>Sonhos</div>
        <div class="nav-item" onclick="irPara('mimos', this)"><span>🎟️</span>Mimos</div>
        <div class="nav-item" onclick="irPara('correio', this)"><span>💌</span>Mensagens</div>
    </nav>

    <main id="app" class="hidden">
        <section id="home" class="secao ativa">
            <div id="saudacao" style="font-size: 0.65rem; letter-spacing: 4px; opacity: 0.8; font-weight: 600;"></div>
            <h1 class="titulo-lux">Para Você</h1>
            <div class="foto-inteira-container"><img src="Amor.png" class="foto-inteira-img"></div>
            <div id="timer" style="font-size: 0.85rem; letter-spacing: 1px; margin-bottom: 20px; font-weight: 300;"></div>
            <div class="glass-card">
                <p style="font-size: 0.7rem; margin-bottom: 15px; font-weight: 600;">SURPRESA DO DIA</p>
                <div class="grid-raspa" id="raspaGrid"></div>
            </div>
        </section>

        <section id="sonhos" class="secao">
            <h2 class="titulo-lux">Desejos & Planos</h2>
            <div id="listaSonhos" style="width: 100%; max-width: 400px; margin-bottom: 20px;"></div>
            <div class="glass-card">
                <input type="text" id="inputSonho" placeholder="O que vamos realizar juntos?">
                <button class="btn-lux" onclick="addSonho()">Adicionar Sonho</button>
            </div>
        </section>

        <section id="mimos" class="secao">
            <h2 class="titulo-lux">Mimos & Datas</h2>
            <div class="glass-card">
                <p style="font-size: 0.75rem; margin-bottom: 12px;">Nosso Calendário 📅</p>
                <div id="calGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;"></div>
            </div>
            <div id="cuponsGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 400px;"></div>
        </section>

        <section id="correio" class="secao">
            <h2 class="titulo-lux">Correio Elegante</h2>
            <div class="glass-card">
                <textarea id="textoC" rows="3" placeholder="Escreva algo especial..."></textarea>
                <button class="btn-lux" onclick="enviarC()">Enviar 💌</button>
            </div>
            <div id="muralC" style="width: 100%; max-width: 400px;"></div>
        </section>
    </main>
