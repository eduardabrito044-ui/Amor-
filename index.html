<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Infinito 💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root { --primary: #9d4edd; --bg: #10002b; --card-bg: rgba(60, 9, 108, 0.7); --text: #e0aaff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
        body { 
            margin: 0; font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #10002b 0%, #240046 50%, #5a189a 100%);
            color: var(--text); overflow: hidden; height: 100vh; 
        }

        .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .hidden { display: none !important; }

        .swiper { width: 100%; height: 100vh; }
        .swiper-slide { display: flex; flex-direction: column; align-items: center; padding: 20px 20px 100px; overflow-y: auto; min-height: 100vh; }

        .card { background: var(--card-bg); border-radius: 25px; padding: 25px; width: 100%; max-width: 450px; border: 1px solid rgba(157, 78, 221, 0.3); margin-bottom: 20px; text-align: center; backdrop-filter: blur(10px); }
        .titulo { font-family: 'Great Vibes', cursive; font-size: 3rem; color: var(--primary); margin: 10px 0; }
        
        .contador { font-size: 1.2rem; font-weight: 600; color: #ff9e00; margin: 15px 0; }
        .foto-casal { width: 130px; height: 130px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; margin-bottom: 15px; box-shadow: 0 0 20px var(--primary); }

        /* Raspadinha Realista */
        .grid-raspadinhas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; justify-items: center; }
        .raspa-box { position: relative; width: 140px; height: 140px; border-radius: 50%; overflow: hidden; border: 3px solid var(--primary); background: #f0f0f0; }
        .desafio-texto { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; color: #240046; padding: 15px; z-index: 1; text-align: center; line-height: 1.2; user-select: none; }
        canvas { position: absolute; top: 0; left: 0; z-index: 2; width: 100%; height: 100%; }

        /* Metas */
        .item-meta { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; text-align: left; background: rgba(255,255,255,0.08); padding: 12px; border-radius: 18px; width: 100%; }
        .item-meta input { width: 20px !important; height: 20px !important; accent-color: var(--primary); flex-shrink: 0; margin-top: 4px !important; }
        .meta-autor { font-size: 0.6rem; color: var(--primary); font-weight: bold; display: block; margin-top: 2px; }

        .btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 50px; font-weight: bold; width: 100%; cursor: pointer; }
        input, textarea, select { width: 100%; padding: 15px; border-radius: 18px; border: 1px solid var(--primary); margin-bottom: 12px; background: rgba(36, 0, 70, 0.6); color: white; text-align: center; }
    </style>
</head>
<body>

    <div id="tela-login" class="overlay">
        <h1 class="titulo">Nosso Infinito</h1>
        <input type="password" id="pass" placeholder="Senha DDMM">
        <select id="user-name">
            <option value="Eduarda">Eduarda</option>
            <option value="Amor">Amor</option>
        </select>
        <button class="btn" style="max-width: 250px;" onclick="entrar()">Entrar 💜</button>
    </div>

    <div id="app" class="swiper hidden">
        <div class="swiper-wrapper">
            
            <div class="swiper-slide">
                <div id="msg-tempo" style="color: #c77dff;"></div>
                <h1 class="titulo">Pecado de Fofo</h1>
                <img src="Amor.png" class="foto-casal">
                <div id="timer" class="contador"></div>
                <div class="card">
                    <p style="font-size: 0.8rem; margin-bottom: 15px;">Passe o dedo para raspar! 👆</p>
                    <div class="grid-raspadinhas" id="gridRaspa"></div>
                </div>
            </div>

            <div class="swiper-slide">
                <h2 class="titulo">Correio Elegante</h2>
                <div class="card">
                    <textarea id="textoCorreio" rows="3" placeholder="Escreva algo..."></textarea>
                    <button class="btn" onclick="enviarCorreio()">Enviar 💌</button>
                </div>
                <div class="card" style="max-height: 400px; overflow-y: auto; width: 100%;">
                    <div id="muralMensagens"></div>
                </div>
            </div>

            <div class="swiper-slide">
                <h2 class="titulo">Nossos Sonhos</h2>
                <div class="card" style="width: 100%;"><div id="listaMetas"></div></div>
                <div class="card">
                    <input type="text" id="novaMeta" placeholder="Nova meta...">
                    <button class="btn" onclick="addMeta()">Salvar Sonho</button>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, set } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz3H8bjiuS2gNvxUr_G3Csd21wL5J1gLw",
            authDomain: "project-3726343372287499417.firebaseapp.com",
            databaseURL: "https://project-3726343372287499417-default-rtdb.firebaseio.com",
            projectId: "project-3726343372287499417"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let meuNome = "";

        const desafios = ["Pagar um lanche", "PIX de 2 Reais", "10 Beijos", "Massagem", "Chocolate", "Cafuné", "Açaí", "Dançar", "Elogio", "Mímica"];

        window.entrar = () => {
            if(document.getElementById('pass').value === "2810") {
                meuNome = document.getElementById('user-name').value;
                document.getElementById('tela-login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                new Swiper('.swiper');
                initApp();
            }
        };

        function initApp() {
            const h = new Date().getHours();
            document.getElementById('msg-tempo').innerText = (h < 18) ? "✨ Bom dia, " + meuNome : "🌙 Boa noite, " + meuNome;
            
            const inicio = new Date("2025-12-28");
            setInterval(() => {
                const diff = Math.floor((new Date() - inicio) / (1000 * 60 * 60 * 24));
                document.getElementById('timer').innerText = diff + " DIAS JUNTOS";
            }, 1000);

            onValue(ref(db, 'raspa_v2'), s => {
                let d = s.val();
                if(!d || d.completas >= 4) {
                    const novos = desafios.sort(() => 0.5 - Math.random()).slice(0, 4);
                    set(ref(db, 'raspa_v2'), { itens: novos, completas: 0 });
                } else {
                    renderRaspa(d.itens);
                }
            });
            syncData();
        }

        function renderRaspa(itens) {
            const grid = document.getElementById('gridRaspa'); grid.innerHTML = "";
            itens.forEach((txt, i) => {
                const box = document.createElement('div');
                box.className = "raspa-box";
                box.innerHTML = `<div class="desafio-texto">${txt}</div><canvas id="cv${i}"></canvas>`;
                grid.appendChild(box);
                
                const cv = document.getElementById(`cv${i}`);
                const ctx = cv.getContext('2d', { willReadFrequently: true });
                cv.width = 140; cv.height = 140;

                ctx.fillStyle = '#7b2cbf';
                ctx.fillRect(0,0,140,140);

                const scratch = (e) => {
                    e.preventDefault();
                    const r = cv.getBoundingClientRect();
                    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                    const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                    
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.beginPath();
                    ctx.arc(x, y, 20, 0, Math.PI * 2);
                    ctx.fill();

                    // Detecta se já raspou o bastante (mais de 40% do canvas)
                    const pixels = ctx.getImageData(0, 0, 140, 140).data;
                    let clear = 0;
                    for(let p=3; p<pixels.length; p+=4) { if(pixels[p] === 0) clear++; }
                    if(clear > (pixels.length/4) * 0.4) {
                        cv.style.pointerEvents = 'none';
                        cv.style.opacity = '0'; // Faz o resto sumir suavemente
                    }
                };

                cv.addEventListener('mousemove', scratch);
                cv.addEventListener('touchmove', scratch);
            });
        }

        window.enviarCorreio = () => {
            const t = document.getElementById('textoCorreio').value;
            if(t) push(ref(db, 'correio'), { texto: t, autor: meuNome });
            document.getElementById('textoCorreio').value = "";
        };

        window.addMeta = () => {
            const t = document.getElementById('novaMeta').value;
            if(t) push(ref(db, 'metas'), { texto: t, feito: false, autor: meuNome });
            document.getElementById('novaMeta').value = "";
        };

        function syncData() {
            onValue(ref(db, 'correio'), s => {
                const m = document.getElementById('muralMensagens'); m.innerHTML = "";
                s.forEach(c => { m.innerHTML = `<div class="msg-item"><span class="msg-autor">${c.val().autor} disse:</span>${c.val().texto}</div>` + m.innerHTML; });
            });
            onValue(ref(db, 'metas'), s => {
                const l = document.getElementById('listaMetas'); l.innerHTML = "";
                s.forEach(m => {
                    const d = m.val();
                    l.innerHTML += `<div class="item-meta">
                        <input type="checkbox" ${d.feito?'checked':''} onchange="update(ref(getDatabase(), 'metas/${m.key}'), {feito:${!d.feito}})">
                        <div>
                            <span style="color:#fff;font-size:0.9rem">${d.texto}</span>
                            <span class="meta-autor">✍️ Por: ${d.autor || 'Nós'}</span>
                        </div>
                    </div>`;
                });
            });
        }
    </script>
</body>
</html>
