<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Infinito ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&family=Dancing+Script:wght@700&display=swap');

        :root { --p: #ff85a2; --s: #d4af37; --bg: #fff0f3; --txt: #4a4a4a; }
        body.noite { --bg: #0a0a1a; --txt: #f0f0f0; --p: #a55eea; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--txt); transition: 0.8s; overflow-x: hidden; }

        /* Fundo Lava Lamp de Corações */
        .lava { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .coracao-flutuante { position: absolute; bottom: -20px; color: var(--p); opacity: 0.6; animation: flutuar 6s linear infinite; }
        @keyframes flutuar { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }

        /* Telas de Acesso */
        .full-screen { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .hidden { display: none !important; }

        /* Nav Estilo App */
        nav { position: fixed; top: 0; width: 100%; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); display: flex; overflow-x: auto; padding: 10px; z-index: 1000; border-bottom: 2px solid var(--p); }
        nav a { padding: 10px 18px; text-decoration: none; color: var(--txt); font-size: 0.8rem; font-weight: 600; white-space: nowrap; }

        /* Cards e Layout */
        .container { padding: 80px 15px 100px; }
        .card { background: rgba(255,255,255,0.2); border: 2px solid var(--p); border-radius: 25px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(5px); }
        .titulo { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: var(--p); text-align: center; margin: 10px 0; }
        
        /* Botões */
        .btn { background: var(--p); color: white; border: none; padding: 12px 20px; border-radius: 50px; font-weight: bold; width: 100%; margin: 5px 0; }
        .heart-pulse { width: 100px; height: 100px; background: #ff4757; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 10px auto; animation: pulse 1.5s infinite; border: none; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        /* Correio */
        .envelope { height: 80px; background: var(--p); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Mascotes */
        .mascote { position: fixed; bottom: 10px; width: 60px; z-index: 2000; transition: 0.3s; }
        .balao { position: fixed; bottom: 80px; background: white; color: black; padding: 10px; border-radius: 15px; font-size: 0.7rem; display: none; width: 120px; border: 2px solid var(--p); }
    </style>
</head>
<body>

    <div id="tela-senha" class="full-screen">
        <h1 class="titulo">Nosso Lugar</h1>
        <input type="password" id="pass" placeholder="Data Especial (DDMM)" style="width:80%; padding:15px; border-radius:15px; border:2px solid var(--p); text-align:center;">
        <button class="btn" onclick="checkPass()" style="width:80%; margin-top:15px;">Abrir Portão</button>
    </div>

    <div id="tela-quem" class="full-screen hidden">
        <h2 class="titulo">Quem está entrando?</h2>
        <button class="btn" onclick="setUser('Eduarda')">Sou a Eduarda 👑</button>
        <button class="btn" onclick="setUser('Amor')" style="background:var(--s)">Sou o Amor 🧸</button>
    </div>

    <div id="main-content" class="hidden">
        <div class="lava" id="lava"></div>
        <nav>
            <a href="#" onclick="tab('home')">🏠 Home</a>
            <a href="#" onclick="tab('correio')">💌 Cartas</a>
            <a href="#" onclick="tab('planos')">📅 Planos</a>
            <a href="#" onclick="tab('escrita')">✍️ Escrever</a>
        </nav>

        <div class="container">
            <div id="home" class="tab-content">
                <h1 class="titulo">Desde 28/12/2025</h1>
                <div class="card">
                    <p style="text-align:center;">Tô pensando em você!</p>
                    <button class="heart-pulse" onclick="mandarPensamento()">❤️</button>
                    <p id="contPensar" style="text-align:center; font-weight:bold;">0 batimentos</p>
                </div>
                <div class="card" id="areaRaspadinha">
                    <p>Elogio do dia (toque para ler):</p>
                    <div id="elogioRevelado" style="font-weight:bold; color:var(--p); text-align:center; min-height:30px;"></div>
                </div>
            </div>

            <div id="correio" class="tab-content hidden">
                <h2 class="titulo">Suas Cartas</h2>
                <div class="grid" id="gridCartas">
                    </div>
                <div id="viewCarta" class="card hidden" style="margin-top:20px; border-style:dashed;"></div>
            </div>

            <div id="escrita" class="tab-content hidden">
                <h2 class="titulo">Escrever para o Outro</h2>
                <div class="card">
                    <p>Para qual carta?</p>
                    <select id="tipoCarta" class="btn" style="background:white; color:black; border:1px solid var(--p)">
                        <option value="Saudade">Quando sentir saudade</option>
                        <option value="Triste">Quando estiver triste</option>
                        <option value="Rir">Para te fazer rir</option>
                        <option value="Elogio">Um elogio novo</option>
                    </select>
                    <textarea id="msgTexto" placeholder="Escreva aqui..." style="width:100%; height:100px; border-radius:15px; padding:10px; margin-top:10px;"></textarea>
                    <button class="btn" onclick="salvarMensagem()">Enviar para o Coração dele(a)</button>
                </div>
            </div>
        </div>

        <div id="balao-m" class="balao">Oi amor!</div>
        <img src="https://cdn-icons-png.flaticon.com/512/2566/2566113.png" class="mascote" style="left:10px;" onclick="falar('E')">
        <img src="https://cdn-icons-png.flaticon.com/512/2566/2566103.png" class="mascote" style="right:10px;" onclick="falar('A')">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update, increment } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz3H8bjiuS2gNvxUr_G3Csd21wL5J1gLw",
            authDomain: "project-3726343372287499417.firebaseapp.com",
            databaseURL: "https://project-3726343372287499417-default-rtdb.firebaseio.com",
            projectId: "project-3726343372287499417",
            storageBucket: "project-3726343372287499417.firebasestorage.app",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentUser = "";

        // --- SISTEMA DE ACESSO ---
        window.checkPass = () => {
            if(document.getElementById('pass').value === "2810") {
                document.getElementById('tela-senha').classList.add('hidden');
                document.getElementById('tela-quem').classList.remove('hidden');
            } else { alert("Senha incorreta!"); }
        };

        window.setUser = (user) => {
            currentUser = user;
            document.getElementById('tela-quem').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            initApp();
        };

        function initApp() {
            gerarCorações();
            carregarDados();
            if(new Date().getHours() >= 18 || new Date().getHours() < 6) document.body.classList.add('noite');
        }

        // --- FUNCIONALIDADES ---
        window.salvarMensagem = () => {
            const tipo = document.getElementById('tipoCarta').value;
            const txt = document.getElementById('msgTexto').value;
            const destino = (currentUser === "Eduarda") ? "Amor" : "Eduarda";
            
            // Salva no Firebase: destino (quem vai ler) / tipo (qual carta é)
            set(ref(db, `mensagens/${destino}/${tipo}`), { msg: txt, autor: currentUser });
            alert("Enviado com sucesso!");
            document.getElementById('msgTexto').value = "";
        };

        function carregarDados() {
            // Batimentos
            onValue(ref(db, 'batimentos'), (s) => {
                document.getElementById('contPensar').innerText = (s.val() || 0) + " batimentos hoje";
            });

            // Cartas (Mostra o que mandaram PARA o usuário atual)
            const tipos = ['Saudade', 'Triste', 'Rir', 'Elogio'];
            const grid = document.getElementById('gridCartas');
            grid.innerHTML = "";
            tipos.forEach(t => {
                grid.innerHTML += `<div class="envelope" onclick="lerCarta('${t}')">📩<br><span style="font-size:0.6rem">${t}</span></div>`;
            });
        }

        window.lerCarta = (tipo) => {
            onValue(ref(db, `mensagens/${currentUser}/${tipo}`), (s) => {
                const view = document.getElementById('viewCarta');
                view.classList.remove('hidden');
                if(s.exists()) {
                    view.innerHTML = `<strong>Carta de ${s.val().autor}:</strong><br>${s.val().msg}`;
                } else {
                    view.innerHTML = "Ainda não tem nada aqui... peça para ele(a) escrever!";
                }
            }, { onlyOnce: true });
        };

        window.mandarPensamento = () => {
            update(ref(db, 'batimentos'), increment(1));
            if(navigator.vibrate) navigator.vibrate(50);
        };

        // --- VISUAL ---
        function gerarCorações() {
            const lava = document.getElementById('lava');
            setInterval(() => {
                const c = document.createElement('div');
                c.innerHTML = "❤️";
                c.className = "coracao-flutuante";
                c.style.left = Math.random() * 100 + "vw";
                c.style.fontSize = (Math.random() * 20 + 10) + "px";
                lava.appendChild(c);
                setTimeout(() => c.remove(), 6000);
            }, 1000);
        }

        window.tab = (id) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        };

        window.falar = (quem) => {
            const b = document.getElementById('balao-m');
            b.style.display = "block";
            b.innerText = quem === 'E' ? "Eduarda te ama!" : "O Amor está com saudade!";
            setTimeout(() => b.style.display = "none", 3000);
        };
    </script>
</body>
</html>
