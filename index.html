<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Infinito ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root { --primary: #ff85a2; --bg: #fff0f3; --text: #4a4a4a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

        /* Notificação Superior */
        #notif { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); width: 90%; background: white; border-radius: 20px; padding: 15px; border: 2px solid var(--primary); z-index: 10000; transition: 0.5s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }

        .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .hidden { display: none !important; }

        .swiper { width: 100%; height: 100vh; }
        .swiper-slide { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; overflow-y: auto; }

        .card { background: rgba(255, 255, 255, 0.9); border-radius: 25px; padding: 20px; width: 100%; max-width: 400px; border: 2px solid var(--primary); margin-bottom: 20px; text-align: center; }
        .titulo { font-family: 'Great Vibes', cursive; font-size: 2.5rem; color: var(--primary); margin: 5px 0; }
        
        .foto-casal { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; }

        /* Botão Coração */
        .heart-btn { width: 80px; height: 80px; background: #ff4757; border-radius: 50%; border: none; color: white; font-size: 2rem; margin: 10px 0; animation: pulse 1.5s infinite; cursor: pointer; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Metas Alinhadas */
        .item-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; text-align: left; }
        .item-meta input { width: 20px; height: 20px; accent-color: var(--primary); }

        /* Cupons e Calendário */
        .grid-cupons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .cupom { background: white; border: 2px dashed var(--primary); padding: 10px; border-radius: 12px; font-size: 0.75rem; }
        .cupom.usado { opacity: 0.3; filter: grayscale(1); }
        .calendario { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .dia { padding: 5px; background: white; border: 1px solid #eee; border-radius: 5px; font-size: 0.7rem; }
        .dia.marcado { background: var(--primary); color: white; }

        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 50px; font-weight: bold; width: 100%; margin-top: 5px; }
        textarea, input[type="text"], input[type="password"] { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--primary); margin-bottom: 8px; }
    </style>
</head>
<body>

    <div id="notif">❤️ <strong>Aviso:</strong> <span id="notif-msg"></span></div>

    <div id="tela-senha" class="overlay">
        <h1 class="titulo">Nossa Data</h1>
        <input type="password" id="pass" placeholder="Senha (DDMM)">
        <button class="btn" style="max-width: 150px;" onclick="entrar()">Entrar</button>
    </div>

    <div id="app" class="swiper hidden">
        <div class="swiper-wrapper">
            
            <div class="swiper-slide">
                <h1 class="titulo">Pecado de Fofo</h1>
                <img src="Amor.png" class="foto-casal">
                <p id="timer" style="font-weight: bold; color: var(--primary); margin: 10px 0;"></p>
                <div class="card">
                    <p style="font-size: 0.8rem;">Dê um toque no coração para eu saber que você está pensando em mim!</p>
                    <button class="heart-btn" onclick="pensando()">❤️</button>
                </div>
                <p style="font-size: 0.7rem;">Arraste para o lado →</p>
            </div>

            <div class="swiper-slide">
                <h2 class="titulo">Correio Elegante</h2>
                <div class="card">
                    <input type="text" id="autor" placeholder="Seu nome">
                    <textarea id="msgCorreio" placeholder="Escreva algo lindo..."></textarea>
                    <button class="btn" onclick="enviarCarta()">Enviar Carta</button>
                </div>
                <div id="boxCartas" style="width: 100%;"></div>
            </div>

            <div class="swiper-slide">
                <h2 class="titulo">Nossas Metas</h2>
                <div class="card">
                    <div id="listaMetas"></div>
                    <input type="text" id="novaMeta" placeholder="Nova meta...">
                    <button class="btn" onclick="addMeta()">Salvar Meta</button>
                </div>
            </div>

            <div class="swiper-slide">
                <h2 class="titulo">Mimos</h2>
                <div class="card">
                    <div class="grid-cupons" id="containerCupons"></div>
                </div>
            </div>

            <div class="swiper-slide">
                <h2 class="titulo">Calendário</h2>
                <div class="card">
                    <div class="calendario" id="calGrid"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz3H8bjiuS2gNvxUr_G3Csd21wL5J1gLw",
            authDomain: "project-3726343372287499417.firebaseapp.com",
            databaseURL: "https://project-3726343372287499417-default-rtdb.firebaseio.com",
            projectId: "project-3726343372287499417",
            storageBucket: "project-3726343372287499417.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const swiper = new Swiper('.swiper', { direction: 'horizontal' });

        window.entrar = () => {
            if(document.getElementById('pass').value === "2810") {
                document.getElementById('tela-senha').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                initApp();
            }
        };

        function initApp() {
            // Timer
            const start = new Date("2025-12-28");
            setInterval(() => {
                const dias = Math.floor((new Date() - start) / (1000*60*60*24));
                document.getElementById('timer').innerText = dias + " dias juntos!";
            }, 1000);

            // Sincronização
            sync();
            for(let i=1; i<=31; i++) document.getElementById('calGrid').innerHTML += `<div class="dia" onclick="this.classList.toggle('marcado')">${i}</div>`;
        }

        window.pensando = () => {
            push(ref(db, 'notificacoes'), { msg: "Alguém está pensando em você agora! ❤️", time: Date.now() });
            alert("Você enviou um sinal de amor!");
        };

        window.enviarCarta = () => {
            const m = document.getElementById('msgCorreio').value;
            const a = document.getElementById('autor').value;
            if(m && a) push(ref(db, 'correio'), { texto: m, de: a });
            document.getElementById('msgCorreio').value = "";
        };

        window.addMeta = () => {
            const t = document.getElementById('novaMeta').value;
            if(t) push(ref(db, 'metas'), { texto: t, feito: false });
            document.getElementById('novaMeta').value = "";
        };

        function sync() {
            onValue(ref(db, 'notificacoes'), snap => {
                const data = snap.val();
                if(data) {
                    const ultima = Object.values(data).pop();
                    document.getElementById('notif-msg').innerText = ultima.msg;
                    document.getElementById('notif').style.top = "20px";
                    setTimeout(() => document.getElementById('notif').style.top = "-100px", 4000);
                }
            });

            onValue(ref(db, 'correio'), snap => {
                const box = document.getElementById('boxCartas'); box.innerHTML = "";
                snap.forEach(c => box.innerHTML += `<div class="card" style="font-size:0.8rem"><strong>${c.val().de}:</strong> ${c.val().texto}</div>`);
            });

            onValue(ref(db, 'metas'), snap => {
                const list = document.getElementById('listaMetas'); list.innerHTML = "";
                snap.forEach(m => {
                    list.innerHTML += `<div class="item-meta">
                        <input type="checkbox" ${m.val().feito?'checked':''} onchange="update(ref(getDatabase(), 'metas/${m.key}'), {feito:${!m.val().feito}})">
                        <span>${m.val().texto}</span></div>`;
                });
            });

            onValue(ref(db, 'cupons_controle'), snap => {
                const d = snap.val() || { usados: 0, pacote: 0 };
                const p = [["Massagem", "Beijo", "Chocolate", "Filme"], ["Jantar", "Cafuné", "Sorvete", "Abraço"]];
                const container = document.getElementById('containerCupons'); container.innerHTML = "";
                p[d.pacote % 2].forEach((c, i) => {
                    container.innerHTML += `<div class="cupom ${i < d.usados ? 'usado' : ''}" onclick="update(ref(getDatabase(), 'cupons_controle'), {usados: ${d.usados + 1}})">🎟️ ${c}</div>`;
                });
                if(d.usados >= 4) update(ref(db, 'cupons_controle'), { usados: 0, pacote: d.pacote + 1 });
            });
        }
    </script>
</body>
</html>
