<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Você 💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #d4af37; 
            --purple-soft: #9d4edd;
            --bg-glass: rgba(255, 255, 255, 0.08);
            --transition: all 0.4s ease;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; 
            overflow: hidden; height: 100vh; width: 100vw;
            transition: var(--transition);
        }

        /* Fundo Dinâmico Minimalista */
        body.dia-claro { 
            background: radial-gradient(circle at top, #ffffff, #f3e5f5); 
            color: #2d005d; --card-bg: rgba(255, 255, 255, 0.7);
        }
        body.noite-estrelada { 
            background: radial-gradient(circle at bottom, #10002b, #240046, #000);
            color: #e0aaff; --card-bg: rgba(60, 9, 108, 0.3);
        }

        /* Estrutura de Abas */
        .secao { 
            display: none; height: 100vh; width: 100%; 
            padding: 40px 20px 120px; overflow-y: auto; 
            animation: fadeIn 0.5s ease;
        }
        .secao.ativa { display: flex; flex-direction: column; align-items: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Menu de Navegação */
        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(20px);
            border-radius: 30px; display: flex; justify-content: space-around;
            padding: 15px; border: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000;
        }
        .nav-item { color: #fff; opacity: 0.5; font-size: 0.7rem; cursor: pointer; text-align: center; flex: 1; transition: var(--transition); }
        .nav-item.ativo { opacity: 1; color: var(--gold); transform: translateY(-5px); }
        .nav-item span { display: block; font-size: 1.2rem; margin-bottom: 3px; }

        /* Cards e Estilo */
        .glass-card {
            background: var(--card-bg); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; padding: 25px; width: 100%; max-width: 400px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center;
        }

        .titulo-lux {
            font-family: 'Playfair Display', serif; font-size: 2.5rem; font-style: italic; margin: 5px 0;
            background: linear-gradient(to right, var(--purple-soft), var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Foto Inteira Premium (Corrigido) */
        .foto-inteira-container {
            width: 100%; max-width: 350px;
            margin-bottom: 15px;
            display: flex; justify-content: center; align-items: center;
        }
        .foto-inteira-img {
            width: 100%; height: auto; /* Mantém a proporção original */
            max-height: 30vh; /* Limita a altura para não poluir a tela */
            object-fit: contain; /* Garante que a imagem inteira apareça sem cortes */
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* Raspadinha */
        .grid-raspa { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .raspa-item { position: relative; width: 100%; aspect-ratio: 1; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); background: #fff; }
        .texto-escondido { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; color: #240046; padding: 10px; text-align: center; }
        canvas { position: absolute; inset: 0; z-index: 2; }

        /* Inputs e Botões */
        .btn-lux {
            background: var(--purple-soft); color: white; border: none; padding: 15px 25px;
            border-radius: 50px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px;
        }
        .overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .hidden { display: none !important; }

        .dia-cal { padding: 8px; border: 1px solid rgba(157,78,221,0.2); border-radius: 8px; text-align: center; cursor: pointer;}
        .marcado { background: var(--purple-soft); color: #fff; }
    </style>
</head>
<body class="noite-estrelada">

    <div id="login" class="overlay">
        <h1 class="titulo-lux">Para Você</h1>
        <input type="password" id="pw" placeholder="Sua senha" style="background:transparent; border:1px solid #444; color:#fff; padding:12px; border-radius:15px; text-align:center;">
        <button class="btn-lux" style="max-width: 200px;" onclick="entrar()">Abrir Portal</button>
    </div>

    <nav class="nav-bar hidden" id="menu">
        <div class="nav-item ativo" onclick="irPara('home', this)"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="irPara('sonhos', this)"><span>✨</span>Sonhos</div>
        <div class="nav-item" onclick="irPara('mimos', this)"><span>🎟️</span>Mimos</div>
        <div class="nav-item" onclick="irPara('correio', this)"><span>💌</span>Correio</div>
    </nav>

    <main id="app" class="hidden">
        <section id="home" class="secao ativa">
            <div id="saudacao" style="font-size: 0.7rem; letter-spacing: 3px; opacity: 0.7;"></div>
            <h1 class="titulo-lux">Para Você</h1>
            
            <div class="foto-inteira-container">
                <img src="Amor.png" class="foto-inteira-img" alt="Foto Inteira">
            </div>

            <div id="timer" style="font-size: 0.9rem; font-weight: 300; margin-bottom: 20px;"></div>
            
            <div class="glass-card">
                <p style="font-size: 0.7rem; margin-bottom: 15px; font-weight: 600;">RASPE O PRESENTE DE HOJE</p>
                <div class="grid-raspa" id="raspaGrid"></div>
            </div>
        </section>

        <section id="sonhos" class="secao">
            <h2 class="titulo-lux">Nossos Sonhos</h2>
            <div id="listaSonhos" style="width: 100%; max-width: 400px; margin-bottom: 20px;"></div>
            <div class="glass-card">
                <input type="text" id="inputSonho" placeholder="O que vamos fazer?" style="width:100%; background:transparent; border:none; border-bottom:1px solid var(--purple-soft); color:inherit; padding:10px;">
                <button class="btn-lux" onclick="addSonho()">Salvar</button>
            </div>
        </section>

        <section id="mimos" class="secao">
            <h2 class="titulo-lux">Datas e Cupons</h2>
            <div class="glass-card">
                <p style="font-size: 0.8rem; margin-bottom: 10px;">Calendário do Mês 📅</p>
                <div id="calGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; font-size: 0.7rem;"></div>
            </div>
            <div id="cuponsGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 400px;"></div>
        </section>

        <section id="correio" class="secao">
            <h2 class="titulo-lux">Correio Elegante</h2>
            <div class="glass-card">
                <textarea id="textoC" rows="3" placeholder="Sua mensagem para mim..." style="width:100%; background:transparent; border:none; color:inherit; border-bottom:1px solid var(--purple-soft);"></textarea>
                <button class="btn-lux" onclick="enviarC()">Enviar Message 💌</button>
            </div>
            <div id="muralC" style="width: 100%; max-width: 400px; margin-top: 10px;"></div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, set } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz3H8bjiuS2gNvxUr_G3Csd21wL5J1gLw",
            authDomain: "project-3726343372287499417.firebaseapp.com",
            databaseURL: "https://project-3726343372287499417-default-rtdb.firebaseio.com",
            projectId: "project-3726343372287499417"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const desafios = ["Jantar Especial", "Massagem", "Vale Açaí", "Cinema", "PIX Surpresa", "100 Beijos", "Cafuné", "Passeio"];

        window.irPara = (id, el) => {
            document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('ativo'));
            document.getElementById(id).classList.add('ativa');
            el.classList.add('ativo');
        };

        window.entrar = () => {
            if(document.getElementById('pw').value === "2810") {
                document.getElementById('login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('menu').classList.remove('hidden');
                start();
            }
        };

        function start() {
            const h = new Date().getHours();
            if(h >= 5 && h < 18) {
                document.body.className = "dia-claro";
                document.getElementById('saudacao').innerText = "ENCANTADA POR VOCÊ";
            } else {
                document.body.className = "noite-estrelada";
                document.getElementById('saudacao').innerText = "NOITE ESTRELADA";
            }

            const inicio = new Date("2015-10-28");
            setInterval(() => {
                const diff = Math.floor((new Date() - inicio) / (1000 * 60 * 60 * 24));
                document.getElementById('timer').innerText = diff + " DIAS DE NÓS";
            }, 1000);

            // Gerar Calendário
            const cal = document.getElementById('calGrid');
            for(let i=1; i<=31; i++) {
                const d = document.createElement('div'); d.className="dia-cal"; d.innerText=i;
                d.onclick=()=>d.classList.toggle('marcado'); cal.appendChild(d);
            }

            // Raspadinha Firebase
            onValue(ref(db, 'raspa_btn'), s => {
                let d = s.val();
                if(!d || d.completas >= 4) {
                    const sorteio = desafios.sort(() => 0.5 - Math.random()).slice(0,4);
                    set(ref(db, 'raspa_btn'), { itens: sorteio, completas: 0, ultimaData: "", raspados: [false,false,false,false] });
                } else { renderRaspa(d); }
            });

            sync();
        }

        function renderRaspa(dados) {
            const grid = document.getElementById('raspaGrid'); grid.innerHTML = "";
            const hoje = new Date().toLocaleDateString();
            const jaFez = dados.ultimaData === hoje;

            dados.itens.forEach((txt, i) => {
                const item = document.createElement('div'); item.className = "raspa-item";
                item.innerHTML = `<div class="texto-escondido">${txt}</div><canvas id="c${i}"></canvas>`;
                grid.appendChild(item);
                const cv = document.getElementById(`c${i}`);
                const ctx = cv.getContext('2d');
                cv.width = 150; cv.height = 150;
                if(dados.raspados[i]) { ctx.clearRect(0,0,150,150); }
                else {
                    ctx.fillStyle = '#9d4edd'; ctx.fillRect(0,0,150,150);
                    const scratch = (e) => {
                        if(jaFez) return;
                        e.preventDefault();
                        const r = cv.getBoundingClientRect();
                        const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                        const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();
                        
                        const pix = ctx.getImageData(0,0,150,150).data;
                        let count = 0; for(let p=3; p<pix.length; p+=4) if(pix[p]===0) count++;
                        if(count > (pix.length/4)*0.4) {
                            dados.raspados[i] = true;
                            update(ref(db, 'raspa_btn'), { raspados: dados.raspados, completas: dados.completas+1, ultimaData: hoje });
                        }
                    };
                    cv.addEventListener('touchmove', scratch); cv.addEventListener('mousemove', scratch);
                }
            });
        }

        window.addSonho = () => {
            const val = document.getElementById('inputSonho').value;
            if(val) push(ref(db, 'sonhos_v2'), { texto: val, status: false, autor: "Eduarda" });
            document.getElementById('inputSonho').value = "";
        };

        window.enviarC = () => {
            const val = document.getElementById('textoC').value;
            if(val) push(ref(db, 'correio_v2'), { texto: val });
            document.getElementById('textoC').value = "";
        };

        function sync() {
            onValue(ref(db, 'sonhos_v2'), s => {
                const l = document.getElementById('listaSonhos'); l.innerHTML = "";
                s.forEach(item => {
                    const d = item.val();
                    l.innerHTML += `<div class="glass-card" style="padding:15px; margin-bottom:10px; display:flex; align-items:center; gap:10px; text-align:left;">
                        <input type="checkbox" ${d.status?'checked':''} onchange="update(ref(getDatabase(), 'sonhos_v2/${item.key}'), {status:!${d.status}})">
                        <span style="font-size:0.8rem; color:inherit;">${d.texto} <br> <small style="color:var(--gold)">por ${d.autor || 'Nós'}</small></span>
                    </div>`;
                });
            });
            onValue(ref(db, 'correio_v2'), s => {
                const m = document.getElementById('muralC'); m.innerHTML = "";
                s.forEach(c => { m.innerHTML = `<div class="glass-card" style="padding:15px; font-size:0.8rem; text-align:left; margin-bottom:10px;">${c.val().texto}</div>` + m.innerHTML; });
            });
            onValue(ref(db, 'cupons_v2'), s => {
                const d = s.val() || { u: 0 };
                const cGrid = document.getElementById('cuponsGrid'); cGrid.innerHTML = "";
                ["Vale Beijo", "Massagem", "Cinema", "Jantar"].forEach((c, i) => {
                    const isU = i < d.u;
                    cont.innerHTML += `<div class="glass-card" style="font-size:0.6rem; padding:10px; opacity:${isU?0.3:1}; cursor:pointer;" onclick="if(!${isU}) update(ref(getDatabase(), 'cupons_v2'), {u:${d.u+1}})">🎟️ ${c}</div>`;
                });
                if(d.u >= 4) set(ref(db, 'cupons_v2'), { u: 0 });
            });
        }
    </script>
</body>
</html>
