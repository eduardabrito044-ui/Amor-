<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Jardim Eterno 💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --purple: #7b2cbf; --dark: #0a001a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; overflow-x: hidden; height: 100vh; width: 100vw;
            background: var(--dark); color: white; transition: 1s;
        }

        .coracao-bg { position: absolute; animation: flutuar 5s infinite ease-in-out; z-index: 0; pointer-events: none; }
        @keyframes flutuar { 
            0%, 100% { transform: scale(1) translateY(0); opacity: 0.2; } 
            50% { transform: scale(1.8) translateY(-20px); opacity: 0.5; } 
        }

        .pensamento-amor {
            position: fixed; top: 12%; width: 100%; text-align: center;
            font-family: 'Great Vibes', cursive; font-size: 1.8rem; color: var(--gold); z-index: 5;
            animation: brilho 6s infinite;
        }
        @keyframes brilho { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

        .secao { display: none; height: 100vh; width: 100%; padding: 20px 20px 120px; overflow-y: auto; position: relative; z-index: 2; }
        .secao.ativa { display: flex; flex-direction: column; align-items: center; }

        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); border-radius: 30px; display: flex; padding: 10px; border: 1px solid var(--purple); z-index: 1000;
        }
        .nav-item { color: #fff; opacity: 0.4; font-size: 0.7rem; cursor: pointer; text-align: center; flex: 1; }
        .nav-item.ativo { opacity: 1; color: var(--gold); }
        .nav-item span { display: block; font-size: 1.3rem; }

        .glass-card {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px; padding: 20px; width: 100%; max-width: 400px; margin-bottom: 15px; text-align: center;
        }

        .titulo-lux { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: var(--gold); margin: 15px 0; }

        .grid-raspa { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .raspa-item { position: relative; aspect-ratio: 1; border-radius: 20px; overflow: hidden; background: #fff; border: 2.5px solid var(--purple); }
        .texto-escondido { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: #1a0033; font-weight: bold; text-align: center; padding: 5px; }
        canvas { position: absolute; inset: 0; z-index: 2; touch-action: none; }

        .btn-lux { background: linear-gradient(45deg, var(--purple), #9d4edd); color: white; border: none; padding: 16px; border-radius: 50px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        
        input { width: 100%; background: rgba(255,255,255,0.1); border: 1.5px solid var(--purple); border-radius: 15px; padding: 14px; color: white; margin-bottom: 12px; }
        .overlay { position: fixed; inset: 0; background: radial-gradient(circle, #1a0033, #050010); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login" class="overlay">
        <h1 class="titulo-lux">Nosso Jardim</h1>
        <input type="text" id="user-name" placeholder="Seu nome (Ex: Eduarda ou Nome dele)">
        <input type="password" id="pw" placeholder="Senha (2810)">
        <button class="btn-lux" onclick="entrar()">Entrar no Portal</button>
    </div>

    <div id="bg-coracoes"></div>
    <div class="pensamento-amor">Seu amor está pensando em você...</div>

    <nav class="nav-bar hidden" id="menu">
        <div class="nav-item ativo" onclick="irPara('home', this)"><span>🏠</span>Início</div>
        <div class="nav-item" onclick="irPara('mimos', this)"><span>🎟️</span>Mimos</div>
        <div class="nav-item" onclick="irPara('sonhos', this)"><span>✨</span>Sonhos</div>
    </nav>

    <main id="app" class="hidden">
        <section id="home" class="secao ativa">
            <h1 class="titulo-lux" id="boas-vindas">Para Você</h1>
            <div id="timer" style="font-family: 'Great Vibes', cursive; font-size: 1.8rem; color: var(--gold); margin-bottom: 10px;"></div>
            
            <div class="glass-card">
                <p id="label-raspa" style="font-size:0.7rem; font-weight:bold; color: var(--gold); margin-bottom:15px;">SUA SURPRESA DE HOJE</p>
                <div class="grid-raspa" id="raspaGrid"></div>
            </div>
        </section>

        <section id="mimos" class="secao">
            <h2 class="titulo-lux">Cupons de Carinho</h2>
            <div id="cuponsGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width:100%;"></div>
        </section>

        <section id="sonhos" class="secao">
            <h2 class="titulo-lux">Nossos Sonhos</h2>
            <div id="listaSonhos" style="width:100%; margin-bottom: 15px;"></div>
            <div class="glass-card">
                <input type="text" id="inputSonho" placeholder="O que vamos fazer juntos?">
                <button class="btn-lux" onclick="addSonho()">Salvar</button>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz3H8bjiuS2gNvxUr_G3Csd21wL5J1gLw",
            authDomain: "project-3726343372287499417.firebaseapp.com",
            databaseURL: "https://project-3726343372287499417-default-rtdb.firebaseio.com",
            projectId: "project-3726343372287499417"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let usuarioAtivo = "";

        window.entrar = () => {
            const nome = document.getElementById('user-name').value.trim();
            if(document.getElementById('pw').value === "2810" && nome !== "") {
                usuarioAtivo = nome.toLowerCase();
                document.getElementById('boas-vindas').innerText = "Oi, " + nome + "!";
                document.getElementById('login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('menu').classList.remove('hidden');
                initVisual();
                sync();
            } else { alert("Coloque seu nome e a senha certa!"); }
        };

        window.irPara = (id, el) => {
            document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('ativo'));
            document.getElementById(id).classList.add('ativa');
            el.classList.add('ativo');
        };

        function initVisual() {
            const bg = document.getElementById('bg-coracoes');
            for(let i=0; i<25; i++) {
                const c = document.createElement('div'); c.className = 'coracao-bg'; c.innerText = '❤️';
                c.style.left = Math.random() * 100 + 'vw'; c.style.top = Math.random() * 100 + 'vh';
                c.style.fontSize = (Math.random() * 20 + 20) + 'px';
                c.style.animationDelay = Math.random() * 5 + 's'; bg.appendChild(c);
            }
            const diff = Math.floor((new Date() - new Date("2025-10-28")) / (1000 * 60 * 60 * 24));
            document.getElementById('timer').innerText = diff + " Dias Juntos";
        }

        function sync() {
            const hoje = new Date().toLocaleDateString();
            
            // Itens diferentes para cada um
            const itensParaEduarda = ["Vale um Açaí 🍧", "Massagem nos Pés 💆‍♀️", "Beijo de 5 min 💋", "Sessão de Desenho ✍️"];
            const itensParaEle = ["Vale Jantar 🍕", "Cafuné Ilimitado 💆‍♂️", "Vale Game/Filme 🎮", "Abraço de Urso 🫂"];
            
            const meusItens = (usuarioAtivo.includes("eduarda") || usuarioAtivo.includes("duda")) ? itensParaEduarda : itensParaEle;

            onValue(ref(db, 'raspa_vPersonalizada_' + usuarioAtivo), s => {
                const d = s.val() || { data: "" };
                const grid = document.getElementById('raspaGrid'); grid.innerHTML = "";
                const jaRaspou = d.data === hoje;

                meusItens.forEach((txt, i) => {
                    const item = document.createElement('div'); item.className = "raspa-item";
                    item.innerHTML = `<div class="texto-escondido">${txt}</div><canvas id="cv${i}"></canvas>`;
                    grid.appendChild(item);
                    
                    const cv = document.getElementById(`cv${i}`); const ctx = cv.getContext('2d');
                    cv.width=150; cv.height=150;
                    
                    if(jaRaspou) { 
                        ctx.clearRect(0,0,150,150); 
                    } else {
                        ctx.fillStyle = '#9d4edd'; ctx.fillRect(0,0,150,150);
                        ctx.globalCompositeOperation = 'destination-out';

                        const draw = (e) => {
                            e.preventDefault(); const r = cv.getBoundingClientRect();
                            const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                            const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                            ctx.beginPath(); ctx.arc(x,y,25,0,Math.PI*2); ctx.fill();
                            
                            const pix = ctx.getImageData(0,0,150,150).data;
                            let v = 0; for(let p=3; p<pix.length; p+=4) if(pix[p]===0) v++;
                            if(v > 4500 && d.data !== hoje) {
                                update(ref(db, 'raspa_vPersonalizada_' + usuarioAtivo), { data: hoje });
                            }
                        };
                        cv.addEventListener('touchmove', draw); cv.addEventListener('mousemove', draw);
                    }
                });
            });

            // Sonhos (Esses são compartilhados)
            onValue(ref(db, 'sonhos_vShared'), s => {
                const l = document.getElementById('listaSonhos'); l.innerHTML = "";
                s.forEach(item => {
                    const v = item.val();
                    l.innerHTML += `<div style="display:flex; align-items:center; background:rgba(255,255,255,0.1); padding:10px; border-radius:15px; margin-bottom:8px;">
                        <input type="checkbox" style="width:20px; height:20px; margin-right:10px;" ${v.status?'checked':''} onchange="update(ref(db, 'sonhos_vShared/${item.key}'), {status:!${v.status}})">
                        <span style="font-family:'Playfair Display'; ${v.status?'text-decoration:line-through; opacity:0.5;':''}">${v.texto}</span>
                    </div>`;
                });
            });
        }

        window.addSonho = () => {
            const v = document.getElementById('inputSonho').value;
            if(v) push(ref(db, 'sonhos_vShared'), { texto: v, status: false });
            document.getElementById('inputSonho').value = "";
        };
    </script>
</body>
</html>
