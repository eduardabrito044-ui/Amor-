<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Jardim 💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #d4af37; --purple: #7b2cbf; --dark: #0a001a; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; overflow: hidden; height: 100vh; width: 100vw;
            background: var(--dark); color: white; transition: 1s;
        }

        /* Corações Pulsantes */
        .coracao-bg { position: absolute; animation: pulsar 4s infinite ease-in-out; z-index: 0; pointer-events: none; opacity: 0.3; }
        @keyframes pulsar { 
            0%, 100% { transform: scale(1) translateY(0); opacity: 0.2; } 
            50% { transform: scale(1.4) translateY(-10px); opacity: 0.6; } 
        }

        /* Mensagem "Seu amor está pensando em você" */
        .pensamento-amor {
            position: fixed; top: 15%; width: 100%; text-align: center;
            font-family: 'Playfair Display', serif; font-style: italic;
            font-size: 1rem; color: var(--gold); z-index: 5;
            animation: brilhoMensagem 6s infinite ease-in-out;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        @keyframes brilhoMensagem {
            0%, 100% { opacity: 0; transform: translateY(5px); }
            50% { opacity: 1; transform: translateY(0); }
        }

        .astro { position: absolute; top: 20px; right: 20px; font-size: 3rem; z-index: 1; }

        .secao { display: none; height: 100vh; width: 100%; padding: 20px 20px 120px; overflow-y: auto; position: relative; z-index: 2; }
        .secao.ativa { display: flex; flex-direction: column; align-items: center; }

        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); border-radius: 30px; display: flex; padding: 10px; border: 1px solid var(--purple); z-index: 1000;
        }
        .nav-item { color: #fff; opacity: 0.4; font-size: 0.6rem; cursor: pointer; text-align: center; flex: 1; }
        .nav-item.ativo { opacity: 1; color: var(--gold); }
        .nav-item span { display: block; font-size: 1.2rem; }

        .glass-card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 15px; width: 100%; max-width: 400px; margin-bottom: 15px; text-align: center;
        }

        .titulo-lux { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--gold); margin: 10px 0; }

        .grid-raspa { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .raspa-item { position: relative; aspect-ratio: 1; border-radius: 15px; overflow: hidden; background: #fff; border: 1.5px solid var(--purple); }
        .texto-escondido { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #1a0033; font-weight: bold; text-align: center; z-index: 1; }
        canvas { position: absolute; inset: 0; z-index: 2; touch-action: none; }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .dia-cal { font-size: 0.6rem; padding: 8px 0; border: 1px solid rgba(255,255,255,0.1); border-radius: 5px; }
        .marcado { background: var(--purple) !important; color: white; }

        .btn-lux { background: var(--purple); color: white; border: none; padding: 14px; border-radius: 50px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        input, textarea { width: 100%; background: rgba(255,255,255,0.15); border: 1px solid var(--gold); border-radius: 10px; padding: 12px; color: white; margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login" class="overlay">
        <h1 class="titulo-lux" style="color: white;">Nosso Jardim 💜</h1>
        <input type="text" id="user-name" placeholder="Seu Nome">
        <input type="password" id="pw" placeholder="Senha do Dia">
        <button class="btn-lux" onclick="entrar()">Abrir Portal</button>
    </div>

    <div id="astro-icon" class="astro">☀️</div>
    <div id="bg-coracoes"></div>
    <div class="pensamento-amor">Seu amor está pensando em você...</div>

    <nav class="nav-bar hidden" id="menu">
        <div class="nav-item ativo" onclick="irPara('home', this)"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="irPara('mimos', this)"><span>🎟️</span>Mimos</div>
        <div class="nav-item" onclick="irPara('sonhos', this)"><span>✨</span>Sonhos</div>
        <div class="nav-item" onclick="irPara('correio', this)"><span>💌</span>Correio</div>
    </nav>

    <main id="app" class="hidden">
        <section id="home" class="secao ativa">
            <h1 class="titulo-lux">Para Você</h1>
            <img src="Amor.png" style="width:100%; border-radius:15px; border: 2px solid var(--gold); margin-bottom: 10px;">
            <div id="timer" style="font-weight: bold; color: var(--gold); margin-bottom: 10px;"></div>
            
            <div class="glass-card">
                <p id="label-raspa" style="font-size:0.6rem; font-weight:bold; letter-spacing:1px;">RASPADINHA DO DIA (SÓ 1)</p>
                <div class="grid-raspa" id="raspaGrid"></div>
            </div>

            <div class="glass-card">
                <p style="font-size:0.6rem; font-weight:bold;">NOSSO CALENDÁRIO</p>
                <div class="cal-grid" id="calGrid"></div>
            </div>
        </section>

        <section id="mimos" class="secao">
            <h2 class="titulo-lux">Cupons de Mimo</h2>
            <div id="cuponsGrid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width:100%; max-width:400px;"></div>
        </section>

        <section id="sonhos" class="secao">
            <h2 class="titulo-lux">Nossos Sonhos</h2>
            <div id="listaSonhos" style="width:100%; max-width:400px; margin-bottom: 10px;"></div>
            <div class="glass-card">
                <input type="text" id="inputSonho" placeholder="Adicionar desejo...">
                <button class="btn-lux" onclick="addSonho()">Salvar Sonho</button>
            </div>
        </section>

        <section id="correio" class="secao">
            <h2 class="titulo-lux">Correio Elegante</h2>
            <div class="glass-card">
                <textarea id="textoC" rows="3" placeholder="Sua mensagem..."></textarea>
                <button class="btn-lux" onclick="enviarC()">Enviar 💌</button>
            </div>
            <div id="muralC" style="width:100%; max-width:400px;"></div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, set } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz3H8bjiuS2gNvxUr_G3Csd21wL5J1gLw",
            authDomain: "project-3726343372287499417.firebaseapp.com",
            databaseURL: "https://project-3726343372287499417-default-rtdb.firebaseio.com",
            projectId: "project-3726343372287499417"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let usuarioAtivo = "";

        window.irPara = (id, el) => {
            document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('ativo'));
            document.getElementById(id).classList.add('ativa');
            el.classList.add('ativo');
        };

        window.entrar = () => {
            if(document.getElementById('pw').value === "2810") {
                usuarioAtivo = document.getElementById('user-name').value || "Amor";
                document.getElementById('login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('menu').classList.remove('hidden');
                initVisual();
                sync();
            }
        };

        function initVisual() {
            const h = new Date().getHours();
            const isDia = h >= 6 && h < 18;
            document.body.style.background = isDia ? "radial-gradient(circle, #7b2cbf, #1a0033)" : "#050010";
            document.getElementById('astro-icon').innerText = isDia ? "☀️" : "🌙";
            
            const bg = document.getElementById('bg-coracoes');
            for(let i=0; i<20; i++) {
                const c = document.createElement('div'); c.className = 'coracao-bg'; c.innerText = '❤️';
                c.style.left = Math.random() * 100 + 'vw'; c.style.top = Math.random() * 100 + 'vh';
                c.style.animationDelay = Math.random() * 4 + 's'; bg.appendChild(c);
            }

            const timerUpdate = () => {
                const diff = Math.floor((new Date() - new Date("2025-10-28")) / (1000 * 60 * 60 * 24));
                document.getElementById('timer').innerText = diff + " Dias de Nós";
            };
            timerUpdate();

            const cal = document.getElementById('calGrid');
            for(let i=1; i<=31; i++) {
                const d = document.createElement('div'); d.className="dia-cal"; d.innerText=i;
                d.onclick=()=>d.classList.toggle('marcado'); cal.appendChild(d);
            }
        }

        function sync() {
            const hojeStr = new Date().toLocaleDateString();

            onValue(ref(db, 'raspa_v8'), s => {
                const d = s.val() || { itens: ["Beijo", "Açaí", "Massagem", "Jantar"], dataUltima: "" };
                const grid = document.getElementById('raspaGrid'); grid.innerHTML = "";
                const jaRaspoHoje = d.dataUltima === hojeStr;
                if(jaRaspoHoje) document.getElementById('label-raspa').innerText = "VOLTE AMANHÃ! ✨";

                d.itens.forEach((txt, i) => {
                    const item = document.createElement('div'); item.className = "raspa-item";
                    item.innerHTML = `<div class="texto-escondido">${txt}</div><canvas id="cv${i}"></canvas>`;
                    grid.appendChild(item);
                    const cv = document.getElementById(`cv${i}`); const ctx = cv.getContext('2d'); cv.width=150; cv.height=150;
                    if(jaRaspoHoje) ctx.clearRect(0,0,150,150);
                    else {
                        ctx.fillStyle = '#9d4edd'; ctx.fillRect(0,0,150,150);
                        ctx.globalCompositeOperation = 'destination-out';
                        const draw = (e) => {
                            e.preventDefault(); const r = cv.getBoundingClientRect();
                            const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                            const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                            ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();
                            const pix = ctx.getImageData(0,0,150,150).data;
                            let count = 0; for(let p=3; p<pix.length; p+=4) if(pix[p]===0) count++;
                            if(count > 4000 && d.dataUltima !== hojeStr) { update(ref(db, 'raspa_v8'), { dataUltima: hojeStr }); }
                        };
                        cv.addEventListener('touchmove', draw); cv.addEventListener('mousemove', draw);
                    }
                });
            });

            onValue(ref(db, 'cupons_v8'), s => {
                const d = s.val() || { d: ["Massagem", "Vale Jantar", "Vale Beijo", "Açaí"], u: [false,false,false,false], autores: ["","","",""] };
                const grid = document.getElementById('cuponsGrid'); grid.innerHTML = "";
                d.d.forEach((c, i) => {
                    const isU = d.u[i];
                    grid.innerHTML += `<div class="glass-card" style="padding:15px; ${isU?'opacity:0.4;':''}" onclick="usarC(${i})">
                        <span style="${isU?'text-decoration:line-through; color:red;':''}">🎟️ ${c}</span>
                        <div style="font-size:0.5rem; margin-top:5px;">${isU?'Por: '+d.autores[i]:'Disponível'}</div>
                    </div>`;
                });
                window.usarC = (i) => { if(!d.u[i]) { d.u[i]=true; d.autores[i]=usuarioAtivo; update(ref(db, 'cupons_v8'), d); } };
            });

            onValue(ref(db, 'sonhos_v2'), s => {
                const l = document.getElementById('listaSonhos'); l.innerHTML = "";
                s.forEach(item => {
                    const v = item.val();
                    l.innerHTML += `<div style="display:flex; align-items:center; background:rgba(255,255,255,0.1); padding:8px 12px; border-radius:10px; margin-bottom:5px;">
                        <input type="checkbox" style="margin:0 8px 0 0; width:18px; height:18px;" ${v.status?'checked':''} onchange="update(ref(getDatabase(), 'sonhos_v2/${item.key}'), {status:!${v.status}})">
                        <span style="font-size:0.85rem; flex:1; text-align:left; ${v.status?'text-decoration:line-through; opacity:0.5;':''}">${v.texto}</span>
                    </div>`;
                });
            });

            onValue(ref(db, 'correio_v2'), s => {
                const m = document.getElementById('muralC'); m.innerHTML = "";
                s.forEach(c => { m.innerHTML = `<div class="glass-card" style="text-align:left; font-size:0.75rem;">${c.val().texto}</div>` + m.innerHTML; });
            });
        }

        window.addSonho = () => {
            const v = document.getElementById('inputSonho').value;
            if(v) push(ref(db, 'sonhos_v2'), { texto: v, status: false });
            document.getElementById('inputSonho').value = "";
        };

        window.enviarC = () => {
            const v = document.getElementById('textoC').value;
            if(v) push(ref(db, 'correio_v2'), { texto: `${v}\n\n— De: ${usuarioAtivo} 💌` });
            document.getElementById('textoC').value = "";
        };
    </script>
</body>
</html>
