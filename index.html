<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Infinito 💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root { --primary: #9d4edd; --bg: #10002b; --card-bg: rgba(60, 9, 108, 0.7); --text: #e0aaff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #10002b 0%, #240046 50%, #5a189a 100%);
            color: var(--text); overflow: hidden; height: 100vh; 
        }

        .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .hidden { display: none !important; }

        .swiper { width: 100%; height: 100vh; }
        .swiper-slide { display: flex; flex-direction: column; align-items: center; padding: 40px 20px 120px; overflow-y: auto; }

        .card { background: var(--card-bg); border-radius: 25px; padding: 20px; width: 100%; max-width: 400px; border: 1px solid rgba(157, 78, 221, 0.3); margin-bottom: 20px; text-align: center; backdrop-filter: blur(10px); }
        .titulo { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: var(--primary); margin: 5px 0; }
        
        .contador { font-size: 1.1rem; font-weight: 600; color: #ff9e00; margin: 10px 0; }
        .foto-casal { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; margin-bottom: 15px; box-shadow: 0 0 20px var(--primary); }

        /* Raspadinhas */
        .grid-raspadinhas { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .raspa-box { position: relative; width: 130px; height: 130px; border-radius: 50%; overflow: hidden; border: 2px solid var(--primary); background: #240046; }
        canvas { position: absolute; top: 0; left: 0; z-index: 2; touch-action: none; }
        .desafio-texto { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; color: #ff9e00; padding: 10px; z-index: 1; text-align: center; }
        .bloqueado { opacity: 0.2; filter: grayscale(1); pointer-events: none; }

        /* Mural Identificado */
        .msg-item { background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 15px; border-left: 4px solid var(--primary); text-align: left; margin-bottom: 10px; }
        .msg-autor { font-size: 0.65rem; font-weight: bold; color: var(--primary); text-transform: uppercase; display: block; margin-bottom: 4px; }

        .grid-cupons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cupom { background: #3c096c; border: 2px dashed var(--primary); padding: 12px; border-radius: 15px; font-size: 0.7rem; color: white; position: relative; }
        .cupom.usado { opacity: 0.3; text-decoration: line-through; }
        .quem-usou { position: absolute; bottom: 2px; right: 5px; font-size: 0.5rem; color: #ff9e00; }

        .calendario { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .dia { padding: 8px; background: #240046; border: 1px solid var(--primary); border-radius: 8px; font-size: 0.6rem; color: #fff; }
        .dia.marcado { background: var(--primary); }

        .btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 50px; font-weight: bold; width: 100%; cursor: pointer; }
        input, textarea, select { width: 100%; padding: 14px; border-radius: 15px; border: 1px solid var(--primary); margin-bottom: 10px; background: rgba(36, 0, 70, 0.5); color: white; text-align: center; font-family: inherit; }
    </style>
</head>
<body>

    <div id="tela-login" class="overlay">
        <h1 class="titulo">Nosso Portal</h1>
        <input type="password" id="pass" placeholder="Senha DDMM">
        <select id="user-name">
            <option value="Eduarda">Eu sou a Eduarda</option>
            <option value="Amor">Eu sou o Amor</option>
        </select>
        <button class="btn" style="max-width: 200px;" onclick="entrar()">Acessar 💜</button>
    </div>

    <div id="app" class="swiper hidden">
        <div class="swiper-wrapper">
            
            <div class="swiper-slide">
                <div id="msg-tempo" style="color: #c77dff; font-size: 0.9rem;"></div>
                <h1 class="titulo">Pecado de Fofo</h1>
                <img src="Amor.png" class="foto-casal">
                <div id="timer" class="contador"></div>
                <div class="card">
                    <p id="instrucao" style="font-size: 0.75rem; font-weight: bold;">Escolha 1 de 4 para hoje! 💜</p>
                    <div class="grid-raspadinhas" id="gridRaspa"></div>
                </div>
            </div>

            <div class="swiper-slide">
                <h2 class="titulo">Correio Elegante</h2>
                <div class="card">
                    <textarea id="textoCorreio" rows="3" placeholder="Escreva para seu amor..."></textarea>
                    <button class="btn" onclick="enviarCorreio()">Enviar Mensagem 💌</button>
                </div>
                <div class="card" style="max-height: 400px; overflow-y: auto; width: 100%;">
                    <div id="muralMensagens"></div>
                </div>
            </div>

            <div class="swiper-slide">
                <h2 class="titulo">Nossos Sonhos</h2>
                <div class="card"><div id="listaMetas"></div></div>
                <div class="card">
                    <input type="text" id="novaMeta" placeholder="Novo objetivo...">
                    <button class="btn" onclick="addMeta()">Salvar</button>
                </div>
            </div>

            <div class="swiper-slide">
                <h2 class="titulo">Mimos e Datas</h2>
                <div class="card">
                    <p style="font-size: 0.8rem; margin-bottom: 10px;">Cupons Renováveis 🎟️</p>
                    <div class="grid-cupons" id="containerCupons"></div>
                </div>
                <div class="card">
                    <p style="font-size: 0.8rem; margin-bottom: 10px;">Calendário 📅</p>
                    <div class="calendario" id="calGrid"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz3H8bjiuS2gNvxUr_G3Csd21wL5J1gLw",
            authDomain: "project-3726343372287499417.firebaseapp.com",
            databaseURL: "https://project-3726343372287499417-default-rtdb.firebaseio.com",
            projectId: "project-3726343372287499417"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let meuNome = "";

        window.entrar = () => {
            if(document.getElementById('pass').value === "2810") {
                meuNome = document.getElementById('user-name').value;
                document.getElementById('tela-login').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                new Swiper('.swiper');
                initApp();
            }
        };

        function initApp() {
            // Saudação e Contador
            const h = new Date().getHours();
            document.getElementById('msg-tempo').innerText = (h >= 5 && h < 18) ? "✨ Tenha um Dia Encantado!" : "🌙 Tenha uma Noite Estrelada!";
            const inicio = new Date("2025-12-28");
            setInterval(() => {
                const diff = Math.floor((new Date() - inicio) / (1000 * 60 * 60 * 24));
                document.getElementById('timer').innerText = diff + " DIAS JUNTOS";
            }, 1000);

            // Raspadinha
            const hoje = new Date().toDateString();
            if(localStorage.getItem('dataRaspa') !== hoje) {
                localStorage.removeItem('idRaspaHoje');
                const d = ["Um segredo", "Dê 5 beijos", "Minha mania chata", "Qual nosso melhor date?"];
                localStorage.setItem('desafiosAtuais', JSON.stringify(d.sort(() => 0.5 - Math.random())));
            }
            renderRaspa();
            syncData();

            const cal = document.getElementById('calGrid');
            for(let i=1; i<=31; i++) cal.innerHTML += `<div class="dia" onclick="this.classList.toggle('marcado')">${i}</div>`;
        }

        function renderRaspa() {
            const grid = document.getElementById('gridRaspa'); grid.innerHTML = "";
            const lista = JSON.parse(localStorage.getItem('desafiosAtuais'));
            const idR = localStorage.getItem('idRaspaHoje');
            const jaR = localStorage.getItem('dataRaspa') === new Date().toDateString();

            lista.forEach((t, i) => {
                const box = document.createElement('div');
                box.className = `raspa-box ${jaR && idR != i ? 'bloqueado' : ''}`;
                box.innerHTML = `<div class="desafio-texto">${t}</div><canvas id="cv${i}"></canvas>`;
                grid.appendChild(box);
                const cv = document.getElementById(`cv${i}`);
                const ctx = cv.getContext('2d');
                cv.width = 130; cv.height = 130;
                if(jaR && idR == i) ctx.clearRect(0,0,130,130);
                else { ctx.fillStyle = '#5a189a'; ctx.fillRect(0,0,130,130); }
                
                const scratch = (e) => {
                    if(jaR) return;
                    const r = cv.getBoundingClientRect();
                    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                    const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();
                    if(localStorage.getItem('dataRaspa') !== new Date().toDateString()){
                        localStorage.setItem('dataRaspa', new Date().toDateString());
                        localStorage.setItem('idRaspaHoje', i);
                        setTimeout(() => location.reload(), 500);
                    }
                };
                cv.onmousemove = scratch; cv.ontouchmove = scratch;
            });
        }

        window.enviarCorreio = () => {
            const t = document.getElementById('textoCorreio').value;
            if(t) push(ref(db, 'correio'), { texto: t, autor: meuNome });
            document.getElementById('textoCorreio').value = "";
        };

        window.addMeta = () => {
            const t = document.getElementById('novaMeta').value;
            if(t) push(ref(db, 'metas'), { texto: t, feito: false });
            document.getElementById('novaMeta').value = "";
        };

        function syncData() {
            onValue(ref(db, 'correio'), s => {
                const m = document.getElementById('muralMensagens'); m.innerHTML = "";
                s.forEach(c => { m.innerHTML = `<div class="msg-item"><span class="msg-autor">${c.val().autor} disse:</span>${c.val().texto}</div>` + m.innerHTML; });
            });
            onValue(ref(db, 'metas'), s => {
                const l = document.getElementById('listaMetas'); l.innerHTML = "";
                s.forEach(m => {
                    l.innerHTML += `<div class="item-meta"><input type="checkbox" ${m.val().feito?'checked':''} onchange="update(ref(getDatabase(), 'metas/${m.key}'), {feito:${!m.val().feito}})"><span>${m.val().texto}</span></div>`;
                });
            });
            onValue(ref(db, 'cupons_controle'), s => {
                const d = s.val() || { usados: 0, pacote: 0, quem: "" };
                const p = [["Vale Beijo", "Vale Massagem", "Vale Cinema", "Vale Jantar"], ["Vale Abraço", "Vale Doce", "Vale Cafuné", "Vale Filme"]];
                const cont = document.getElementById('containerCupons'); cont.innerHTML = "";
                p[d.pacote % 2].forEach((c, i) => {
                    const isUsado = i < d.usados;
                    cont.innerHTML += `<div class="cupom ${isUsado?'usado':''}" onclick="if(!${isUsado}) update(ref(getDatabase(), 'cupons_controle'), {usados: ${d.usados + 1}, quem: '${meuNome}'})">🎟️ ${c} ${isUsado?`<span class="quem-usou">por ${d.quem}</span>`:''}</div>`;
                });
                if(d.usados >= 4) update(ref(db, 'cupons_controle'), { usados: 0, pacote: d.pacote + 1, quem: "" });
            });
        }
    </script>
</body>
</html>
