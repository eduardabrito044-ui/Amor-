<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Infinito ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&family=Dancing+Script:wght@700&display=swap');

        :root {
            --primary: #ff85a2;
            --secondary: #d4af37;
            --bg: #fff0f3;
            --text: #4a4a4a;
        }

        /* Reset e Base Mobile */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: 'Poppins', sans-serif; 
            background: var(--bg); color: var(--text); 
            overflow-x: hidden; transition: 1s; 
        }

        /* Temas */
        body.noite { --bg: #0a0a1a; --text: #f0f0f0; --primary: #8e44ad; }
        .stars, .nuvens { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        /* Bloqueio */
        #bloqueio {
            position: fixed; inset: 0; background: var(--bg); z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }

        /* Nav Superior */
        nav { 
            position: fixed; top: 0; width: 100%; background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px); display: flex; overflow-x: auto; 
            padding: 10px; z-index: 1000; border-bottom: 2px solid var(--primary);
        }
        nav::-webkit-scrollbar { display: none; }
        nav a { 
            padding: 8px 15px; text-decoration: none; color: var(--text); 
            font-size: 0.8rem; font-weight: 600; white-space: nowrap;
        }

        /* Containers e Cards */
        .container { padding: 80px 15px 30px; }
        .card { 
            background: rgba(255,255,255,0.15); border: 2px solid var(--primary);
            border-radius: 25px; padding: 20px; margin-bottom: 20px;
            backdrop-filter: blur(5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .titulo { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: var(--primary); margin: 10px 0; }

        /* Botão Tô Pensando em Você */
        .heart-btn {
            width: 120px; height: 120px; background: #ff4757; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; margin: 20px auto; animation: pulse 1.5s infinite;
            border: none; cursor: pointer; box-shadow: 0 0 20px rgba(255,71,87,0.5);
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Correio Elegante */
        .grid-cartas { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .envelope { 
            height: 100px; background: var(--primary); border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; position: relative; overflow: hidden;
        }

        /* Raspadinha */
        .raspadinha-container { 
            position: relative; width: 280px; height: 100px; margin: 0 auto; 
            background: #fff; border-radius: 15px; display: flex; 
            align-items: center; justify-content: center; color: #ff4757; font-weight: bold;
        }
        canvas { position: absolute; top: 0; left: 0; border-radius: 15px; touch-action: none; }

        /* Barra de Progresso */
        .progress-container { background: #eee; border-radius: 20px; height: 20px; margin: 15px 0; overflow: hidden; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: 1s; }

        /* Inputs e Botões */
        input { 
            width: 100%; padding: 12px; border-radius: 15px; border: 2px solid var(--primary);
            background: rgba(255,255,255,0.2); color: var(--text); margin-bottom: 10px;
        }
        .btn { 
            background: var(--primary); color: white; border: none; padding: 12px 20px; 
            border-radius: 50px; font-weight: bold; width: 100%;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideIn 0.4s ease; }
        @keyframes slideIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }

        .item-lista { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; text-align: left; }
        .item-lista input[type="checkbox"] { width: 20px; height: 20px; margin: 0; }
    </style>
</head>
<body>

    <div id="bloqueio">
        <h1 class="titulo">Nosso Mundo</h1>
        <input type="password" id="inputSenha" placeholder="Senha (Nossa Data)">
        <button class="btn" onclick="acessar()">Entrar</button>
    </div>

    <div id="conteudo-privado">
        <div id="ambiente"></div>
        <nav>
            <a href="#" onclick="tab(event, 'home')">🏠 Início</a>
            <a href="#" onclick="tab(event, 'correio')">💌 Correio</a>
            <a href="#" onclick="tab(event, 'metas')">🚀 Metas</a>
            <a href="#" onclick="tab(event, 'capsula')">⏳ Cápsula</a>
            <a href="#" onclick="tab(event, 'cupons')">🎟️ Cupons</a>
            <a href="#" onclick="tab(event, 'jogo')">🎲 Quiz</a>
        </nav>

        <div class="container">
            <div id="home" class="tab-content active">
                <h1 class="titulo">Dese 28/12/2025</h1>
                <p id="timer" style="font-weight: bold; font-size: 1.2rem;"></p>
                
                <div class="card">
                    <p>Pensei em você:</p>
                    <button class="heart-btn" onclick="pensar()">❤️</button>
                    <p id="contagemPensar">0 vezes hoje</p>
                </div>

                <div class="card">
                    <p>Raspadinha do Dia:</p>
                    <div class="raspadinha-container" id="raspadinhaBox">
                        <span id="fraseRaspadinha">Você é incrível!</span>
                        <canvas id="canvasRaspadinha"></canvas>
                    </div>
                </div>
            </div>

            <div id="correio" class="tab-content">
                <h2 class="titulo">Correio Elegante</h2>
                <div class="grid-cartas">
                    <div class="envelope" onclick="abrirCarta('Saudade', '#ff85a2')">📩</div>
                    <div class="envelope" style="background:#8e44ad" onclick="abrirCarta('Triste', '#8e44ad')">📩</div>
                    <div class="envelope" style="background:#d4af37" onclick="abrirCarta('Sorrir', '#d4af37')">📩</div>
                    <div class="envelope" style="background:#3498db" onclick="abrirCarta('Gratidão', '#3498db')">📩</div>
                </div>
                <div id="cartaAberta" class="card" style="display:none; margin-top:20px;"></div>
            </div>

            <div id="metas" class="tab-content">
                <h2 class="titulo">Nossa Jornada</h2>
                <div class="card">
                    <div class="progress-container"><div class="progress-bar" id="progressoMetas"></div></div>
                    <div id="listaMetas"></div>
                    <input type="text" id="novaMeta" placeholder="Nova meta...">
                    <button class="btn" onclick="addMeta()">Adicionar Meta</button>
                </div>
            </div>

            <div id="capsula" class="tab-content">
                <h2 class="titulo">Cápsula do Tempo</h2>
                <div class="card">
                    <textarea id="textoCapsula" style="width:100%; border-radius:15px; padding:10px;" placeholder="Escreva para o futuro..."></textarea>
                    <input type="date" id="dataCapsula">
                    <button class="btn" onclick="salvarCapsula()">Enterrar Cápsula 🏺</button>
                    <div id="mensagensCapsula" style="margin-top:20px;"></div>
                </div>
            </div>

            <div id="cupons" class="tab-content">
                <h2 class="titulo">Loja de Cupons</h2>
                <div id="listaCupons" class="grid-cartas"></div>
            </div>

            <div id="jogo" class="tab-content">
                <h2 class="titulo">Quem é mais?</h2>
                <div class="card" id="quizCard">
                    <p id="perguntaQuiz">Carregando pergunta...</p>
                    <button class="btn" onclick="votar('Eu')">Eu</button>
                    <button class="btn" style="margin-top:10px; background:#d4af37" onclick="votar('Ele(a)')">Ele(a)</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, update, increment } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz3H8bjiuS2gNvxUr_G3Csd21wL5J1gLw",
            authDomain: "project-3726343372287499417.firebaseapp.com",
            databaseURL: "https://project-3726343372287499417-default-rtdb.firebaseio.com",
            projectId: "project-3726343372287499417",
            storageBucket: "project-3726343372287499417.firebasestorage.app",
            messagingSenderId: "198997508418",
            appId: "1:198997508418:web:d6f13c38481348462218db"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- SISTEMA DE ACESSO E TEMA ---
        window.acessar = () => {
            if(document.getElementById('inputSenha').value === "2810") {
                document.getElementById('bloqueio').style.display = 'none';
                document.getElementById('conteudo-privado').style.display = 'block';
                configurarAmbiente();
                iniciarTimer();
                initRaspadinha();
            } else { alert("Senha errada!"); }
        };

        function configurarAmbiente() {
            const hora = new Date().getHours();
            if(hora >= 18 || hora < 6) {
                document.body.classList.add('noite');
                document.getElementById('ambiente').innerHTML = '<div class="stars"></div>';
                gerarEstrelas();
            } else {
                document.getElementById('ambiente').innerHTML = '<div class="nuvens">☁️</div>';
            }
        }

        // --- PENSAR EM VOCÊ ---
        window.pensar = () => {
            update(ref(db, 'interacoes'), { totalPensamentos: increment(1) });
            if(navigator.vibrate) navigator.vibrate(100);
        };
        onValue(ref(db, 'interacoes/totalPensamentos'), (s) => {
            document.getElementById('contagemPensar').innerText = (s.val() || 0) + " vezes hoje";
        });

        // --- METAS ---
        window.addMeta = () => {
            const t = document.getElementById('novaMeta').value;
            if(t) push(ref(db, 'metas'), { texto: t, feito: false });
            document.getElementById('novaMeta').value = "";
        };
        onValue(ref(db, 'metas'), (snap) => {
            const list = document.getElementById('listaMetas');
            list.innerHTML = "";
            let totais = 0, feitos = 0;
            snap.forEach(c => {
                totais++;
                if(c.val().feito) feitos++;
                list.innerHTML += `<div class="item-lista">
                    <input type="checkbox" ${c.val().feito ? 'checked' : ''} onchange="toggleMeta('${c.key}', ${!c.val().feito})">
                    <span>${c.val().texto}</span>
                </div>`;
            });
            document.getElementById('progressoMetas').style.width = (feitos/totais*100 || 0) + '%';
        });
        window.toggleMeta = (id, status) => update(ref(db, `metas/${id}`), { feito: status });

        // --- CÁPSULA ---
        window.salvarCapsula = () => {
            const txt = document.getElementById('textoCapsula').value;
            const data = document.getElementById('dataCapsula').value;
            if(txt && data) push(ref(db, 'capsula'), { txt, data, autor: 'Eduarda' });
            alert("Enterrado com sucesso!");
        };
        onValue(ref(db, 'capsula'), (snap) => {
            const div = document.getElementById('mensagensCapsula');
            div.innerHTML = "";
            const hoje = new Date().toISOString().split('T')[0];
            snap.forEach(c => {
                const liberado = hoje >= c.val().data;
                div.innerHTML += `<div class="card" style="opacity:${liberado ? 1 : 0.5}">
                    ${liberado ? c.val().txt : '🔒 Abre em: ' + c.val().data}
                </div>`;
            });
        });

        // --- RASPADINHA ---
        function initRaspadinha() {
            const canvas = document.getElementById('canvasRaspadinha');
            const ctx = canvas.getContext('2d');
            canvas.width = 280; canvas.height = 100;
            ctx.fillStyle = '#bdc3c7';
            ctx.fillRect(0,0,280,100);
            ctx.globalCompositeOperation = 'destination-out';
            
            const scratch = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI*2); ctx.fill();
            };
            canvas.addEventListener('touchmove', scratch);
        }

        // --- UTILITÁRIOS ---
        window.tab = (e, id) => {
            e.preventDefault();
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        function iniciarTimer() {
            const d = new Date(2025, 11, 28);
            setInterval(() => {
                const diff = Math.floor((new Date() - d) / 86400000);
                document.getElementById('timer').innerText = diff + " dias infinitos";
            }, 1000);
        }

        function gerarEstrelas() {
            const sF = document.querySelector('.stars');
            for(let i=0; i<50; i++){
                const s = document.createElement('div');
                s.style.position = 'absolute'; s.style.background = 'white';
                s.style.width = s.style.height = '2px';
                s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
                sF.appendChild(s);
            }
        }

        window.abrirCarta = (tipo, cor) => {
            const div = document.getElementById('cartaAberta');
            div.style.display = 'block';
            div.style.borderColor = cor;
            const msgs = { 'Saudade': 'Queria estar aí te abraçando agora...', 'Triste': 'Ei, olha pra mim: eu te amo e tudo vai ficar bem. ❤️', 'Sorrir': 'Você sabia que seu sorriso é o meu lugar favorito?' };
            div.innerHTML = `<h3>${tipo}</h3><p>${msgs[tipo] || 'Eu te amo infinito!'}</p>`;
        };

        // Cupons Iniciais
        const cupons = ["Vale 1 Cafuné", "Vale escolher o Filme", "Vale 1 Chocolate", "Vale 1 Jantar"];
        const cupDiv = document.getElementById('listaCupons');
        cupons.forEach(c => {
            cupDiv.innerHTML += `<div class="envelope" style="font-size:0.8rem; padding:10px; text-align:center" onclick="alert('Cupom usado!')">${c}</div>`;
        });
    </script>
</body>
</html>
