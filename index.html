<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nosso Jardim Eterno 💜</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7b2cbf">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

    <style>
        :root { --gold: #d4af37; --purple: #7b2cbf; --dark: #0a001a; --pink: #ff4d6d; --green: #2a9d8f; --red: #e63946; --orange: #f4a261; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; overflow-x: hidden; height: 100vh; width: 100vw;
            background: var(--dark); color: white; transition: 1s;
        }

        .coracao-bg { position: absolute; animation: flutuar 5s infinite ease-in-out; z-index: 0; pointer-events: none; }
        @keyframes flutuar { 
            0%, 100% { transform: scale(1) translateY(0) rotate(0deg); opacity: 0.2; } 
            50% { transform: scale(1.8) translateY(-20px) rotate(15deg); opacity: 0.5; } 
        }

        .pensamento-amor {
            position: fixed; top: 12%; width: 100%; text-align: center;
            font-family: 'Great Vibes', cursive; font-size: 1.8rem; color: var(--gold); z-index: 5;
            animation: brilhoMensagem 6s infinite ease-in-out;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        @keyframes brilhoMensagem { 0%, 100% { opacity: 0; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

        .astro { position: absolute; top: 20px; right: 20px; font-size: 3rem; z-index: 1; filter: drop-shadow(0 0 10px var(--gold)); }

        .secao { display: none; height: 100vh; width: 100%; padding: 20px 20px 120px; overflow-y: auto; position: relative; z-index: 2; }
        .secao.ativa { display: flex; flex-direction: column; align-items: center; }

        .nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 500px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); border-radius: 30px; display: flex; padding: 10px; border: 1px solid var(--purple); z-index: 1000;
        }
        .nav-item { color: #fff; opacity: 0.4; font-size: 0.6rem; cursor: pointer; text-align: center; flex: 1; }
        .nav-item.ativo { opacity: 1; color: var(--gold); font-weight: bold; }
        .nav-item span { display: block; font-size: 1.1rem; margin-bottom: 2px; }

        .glass-card {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px; padding: 20px; width: 100%; max-width: 400px; margin-bottom: 15px; text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .titulo-lux { 
            font-family: 'Great Vibes', cursive !important; 
            font-size: 3.2rem; 
            color: var(--gold); 
            margin: 15px 0; 
            text-shadow: 2px 2px 6px rgba(0,0,0,0.4); 
            text-align: center;
        }

        /* Raspadinhas */
        .grid-raspa { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 340px; margin: 0 auto; }
        .raspa-item { position: relative; aspect-ratio: 1.2; border-radius: 18px; overflow: hidden; background: #fff; border: 2.5px solid var(--purple); box-shadow: 0 6px 16px rgba(0,0,0,0.3); }
        .texto-escondido { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #1a0033; font-weight: bold; text-align: center; z-index: 1; font-family: 'Montserrat', sans-serif; padding: 8px; line-height: 1.2; }
        canvas { position: absolute; inset: 0; z-index: 2; touch-action: none; }

        /* Cupons */
        .mimo-card { background: linear-gradient(135deg, rgba(123, 44, 191, 0.3), rgba(255, 77, 109, 0.2)); border: 1.5px dashed var(--gold); border-radius: 15px; padding: 15px; text-align: center; color: white; display: flex; flex-direction: column; justify-content: space-between; }
        .mimo-card.usado { border-style: solid; border-color: rgba(255,255,255,0.2); opacity: 0.5; }
        .mimo-titulo { font-weight: bold; font-size: 0.9rem; color: var(--gold); margin-bottom: 5px; }
        .mimo-titulo.usado-txt { text-decoration: line-through; color: #ccc; }
        .mimo-desc { font-size: 0.75rem; opacity: 0.9; margin-bottom: 10px; }

        /* Calendário Real */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
        .dia-cal { font-size: 0.7rem; padding: 10px 0; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; }
        .marcado { background: var(--purple) !important; color: white; border-color: var(--gold); box-shadow: 0 0 10px var(--purple); font-weight: bold; }

        .btn-lux { 
            background: linear-gradient(45deg, var(--purple), #9d4edd); 
            color: white; border: none; padding: 16px; border-radius: 50px; 
            font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px;
            font-family: 'Montserrat', sans-serif; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
        }
        .btn-lux:disabled { background: #555 !important; cursor: not-allowed; box-shadow: none; color: #aaa; }

        input, textarea, select { 
            width: 100%; background: rgba(255,255,255,0.1); border: 1.5px solid var(--purple); 
            border-radius: 15px; padding: 14px; color: white; margin-bottom: 12px;
            font-family: 'Montserrat', sans-serif;
        }
        option { background: var(--dark); color: white; }

        .overlay { position: fixed; inset: 0; background: radial-gradient(circle, #1a0033, #050010); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .hidden { display: none !important; }

        .mural-fotos { display: flex; flex-direction: column-reverse; gap: 12px; width: 100%; max-width: 400px; }
        .foto-card { position: relative; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px; border-radius: 15px; text-align: center; }
        .foto-card img { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--purple); cursor: pointer; }
        .foto-card span { font-size: 0.65rem; display: block; margin-top: 7px; color: #ccc; }

        .foto-lightbox {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95);
            display: none; align-items: center; justify-content: center;
            z-index: 10000; padding: 20px; opacity: 0; transition: opacity 0.3s ease;
        }
        .foto-lightbox.show { display: flex; opacity: 1; }
        .foto-lightbox img { max-width: 100%; max-height: 85vh; border-radius: 15px; border: 2px solid var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
    </style>
</head>
<body>
    <!-- Seu conteúdo ajustado sem a área de jogos -->
</body>
</html>
